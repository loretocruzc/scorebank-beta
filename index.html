  function nearbyPages(pages, anchorPage, options = {}) {
    const before = Number.isFinite(options.windowBefore) ? Math.max(0, options.windowBefore) : DEFAULT_WINDOW_BEFORE;
    const after = Number.isFinite(options.windowAfter) ? Math.max(0, options.windowAfter) : DEFAULT_WINDOW_AFTER;
    return Array.from(pages || []).filter((page) => page.pageNumber >= anchorPage - before && page.pageNumber <= anchorPage + after);
  }

  function proximityBonus(distance) {
    if (distance === 0) return 0.18;
    if (distance === 1) return 0.14;
    if (distance === 2) return 0.08;
    if (distance === 3) return 0.04;
    return 0;
  }

  function rankPagesNearAnchor(pages, target, anchorPage, context = {}, options = {}) {
    const limit = Number.isFinite(options.limit) ? Math.max(1, options.limit) : 6;
    return nearbyPages(pages, anchorPage, options)
      .map((page) => {
        const baseScore = scorePageText(page.text, target);
        const distance = Math.abs(page.pageNumber - anchorPage);
        const contextScore = scoreContextAnchor(page.text, context);
        return {
          pageNumber: page.pageNumber,
          score: Math.min(1, baseScore + proximityBonus(distance) + (contextScore * 0.08)),
          baseScore,
          distance,
          contextScore,
          textLength: String(page.text || '').length
        };
      })
      .filter((entry) => entry.baseScore > 0)
      .sort((left, right) => right.score - left.score || left.distance - right.distance || left.pageNumber - right.pageNumber)
      .slice(0, limit);
  }

  function choosePageNearAnchor(pages, target, anchorPage, context = {}, options = {}) {
    const threshold = Number.isFinite(options.threshold) ? options.threshold : DEFAULT_GOSPEL_THRESHOLD;
    const candidates = rankPagesNearAnchor(pages, target, anchorPage, context, options);
    const best = candidates[0] || null;
    return {
      found: Boolean(best && best.score >= threshold && best.baseScore >= 0.28),
      pageNumber: best && best.score >= threshold && best.baseScore >= 0.28 ? best.pageNumber : null,
      score: best?.score || 0,
      baseScore: best?.baseScore || 0,
      distance: best?.distance ?? null,
      candidates
    };
  }

  function isStrongIndexPage(pageText) {
    const n = normalizeText(pageText);
    if (!n) return false;
    return /\bliturgical year index\b|\bindice del ano liturgico\b|\britual index\b|\bindice ritual\b/.test(n);
  }

  function chooseContextAnchorPage(pages, context = {}, options = {}) {
    const threshold = Number.isFinite(options.contextThreshold) ? options.contextThreshold : 0.44;
    const candidates = Array.from(pages || [])
      .map((page) => {
        const contextScore = scoreContextAnchor(page.text, context);
        const normalized = normalizeText(page.text);
        const weeklyContent = /responsorial psalm|salmo responsorial|gospel acclamation|aclamacion del evangelio|aclamacion antes del evangelio/.test(normalized);
        const indexLike = isStrongIndexPage(page.text);
        return {
          pageNumber: page.pageNumber,
          score: Math.max(0, Math.min(1, contextScore + (weeklyContent ? 0.16 : 0) - (indexLike ? 0.78 : 0))),
          contextScore,
          weeklyContent,
          indexLike,
          textLength: String(page.text || '').length
        };
      })
      .filter((entry) => entry.score > 0)
      .sort((left, right) => right.score - left.score || left.pageNumber - right.pageNumber)
      .slice(0, 8);
    const best = candidates[0] || null;
    return {
      found: Boolean(best && best.score >= threshold),
      pageNumber: best && best.score >= threshold ? best.pageNumber : null,
      score: best?.score || 0,
      candidates
    };
  }

  function labelCoverage(pageText, labels) {
    const page = normalizeText(pageText);
    if (!page) return 0;
    let best = 0;
    for (const raw of labels || []) {
      const label = normalizeText(raw);
      if (!label) continue;
      if (page.includes(label)) best = Math.max(best, 1);
      else best = Math.max(best, tokenCoverage(page, label) * 0.72);
    }
    return best;
  }

  function chooseLabeledSectionNearAnchor(pages, labels, anchorPage, context = {}, options = {}) {
    const before = Number.isFinite(options.windowBefore) ? options.windowBefore : 1;
    const after = Number.isFinite(options.windowAfter) ? options.windowAfter : 7;
    const threshold = Number.isFinite(options.labelThreshold) ? options.labelThreshold : 0.62;
    const candidates = nearbyPages(pages, anchorPage, { windowBefore: before, windowAfter: after })
      .map(page => {
        const labelScore = labelCoverage(page.text, labels);
        const distance = Math.abs(page.pageNumber - anchorPage);
        const contextScore = scoreContextAnchor(page.text, context);
        const indexLike = isStrongIndexPage(page.text);
        return {
          pageNumber: page.pageNumber,
          labelScore,
          distance,
          contextScore,
          indexLike,
          score: Math.max(0, Math.min(1, labelScore * 0.78 + proximityBonus(distance) + contextScore * 0.08 - (indexLike ? 0.78 : 0)))
        };
      })
      .filter(entry => entry.labelScore > 0 && !entry.indexLike)
      .sort((a,b)=>b.score-a.score || a.distance-b.distance || a.pageNumber-b.pageNumber);
    const best = candidates[0] || null;
    return {
      found: Boolean(best && best.labelScore >= threshold),
      pageNumber: best && best.labelScore >= threshold ? best.pageNumber : null,
      score: best?.score || 0,
      baseScore: best?.labelScore || 0,
      distance: best?.distance ?? null,
      candidates
    };
  }

  function locateCelebrationSections(pages, input = {}) {
    const context = {
      date: input.date,
      celebration: input.celebration,
      celebrationTitle: input.celebrationTitle,
      sourceData: input.sourceData
    };
    const contextAnchor = chooseContextAnchorPage(pages, context, { ...input, contextThreshold: input.contextThreshold ?? 0.44 });
    if (!contextAnchor.found) {
      return {
        psalm: { found:false, pageNumber:null, score:0, baseScore:0, candidates:[] },
        gospel: { found:false, pageNumber:null, score:0, baseScore:0, candidates:[] },
        complete:false, weeklyBlock:null, contextAnchor, strategy:'celebration-anchor-not-found'
      };
    }
    const psalm = chooseLabeledSectionNearAnchor(
      pages, ['responsorial psalm','salmo responsorial'], contextAnchor.pageNumber, context,
      { ...input, windowBefore:1, windowAfter:7, labelThreshold:0.62 }
    );
    const gospelAnchor = psalm.found ? psalm.pageNumber : contextAnchor.pageNumber;
    const gospel = chooseLabeledSectionNearAnchor(
      pages, ['gospel acclamation','aclamacion del evangelio','aclamacion antes del evangelio','acclamation before the gospel'], gospelAnchor, context,
      { ...input, windowBefore:0, windowAfter:5, labelThreshold:0.62 }
    );
    const foundPages=[psalm.pageNumber,gospel.pageNumber].filter(Number.isFinite);
    return {
      psalm, gospel, complete:psalm.found&&gospel.found, contextAnchor,
      weeklyBlock: foundPages.length ? {
        startPage:Math.min(...foundPages), endPage:Math.max(...foundPages),
        psalmPage:psalm.pageNumber, gospelPage:gospel.pageNumber
      } : null,
      strategy:'celebration-anchor-section-labels'
    };
  }

  function choosePsalmAnchorPage(pages, sourceData, context = {}, options = {}) {
    const target = sectionTarget(sourceData, 'psalm');
    const threshold = Number.isFinite(options.psalmThreshold) ? options.psalmThreshold : DEFAULT_PSALM_THRESHOLD;
    const candidates = Array.from(pages || [])
      .map((page) => {
        const baseScore = scorePageText(page.text, target);
        const contextScore = scoreContextAnchor(page.text, context);
        return {
          pageNumber: page.pageNumber,
          baseScore,
          contextScore,
          score: Math.min(1, baseScore + (contextScore * 0.16)),
          textLength: String(page.text || '').length
        };
      })
      .filter((entry) => entry.baseScore > 0)
      .sort((left, right) => right.score - left.score || right.baseScore - left.baseScore || left.pageNumber - right.pageNumber)
      .slice(0, 8);
    const best = candidates[0] || null;
    return {
      found: Boolean(best && best.score >= threshold && best.baseScore >= 0.5),
      pageNumber: best && best.score >= threshold && best.baseScore >= 0.5 ? best.pageNumber : null,
      score: best?.score || 0,
      baseScore: best?.baseScore || 0,
      candidates
    };
  }


  function locateBestPsalmGospelPair(pages, input = {}) {
    const safePages = Array.from(pages || []);
    const psalmTarget = sectionTarget(input.sourceData, 'psalm');
    const gospelTarget = sectionTarget(input.sourceData, 'gospel');
    const psalmCandidates = safePages
      .map(page => ({ pageNumber: page.pageNumber, score: scorePageText(page.text, psalmTarget), textLength: String(page.text || '').length }))
      .filter(item => item.score >= 0.38)
      .sort((a,b)=>b.score-a.score || a.pageNumber-b.pageNumber)
      .slice(0, 16);
    const pairs = [];
    for (const psalm of psalmCandidates) {
      const gospelCandidates = nearbyPages(safePages, psalm.pageNumber, { windowBefore: 1, windowAfter: 5 })
        .map(page => ({ pageNumber: page.pageNumber, score: scorePageText(page.text, gospelTarget), textLength: String(page.text || '').length }))
        .filter(item => item.score >= 0.24)
        .sort((a,b)=>b.score-a.score || Math.abs(a.pageNumber-psalm.pageNumber)-Math.abs(b.pageNumber-psalm.pageNumber) || a.pageNumber-b.pageNumber);
      const gospel = gospelCandidates[0];
      if (!gospel) continue;
      const distance = Math.abs(gospel.pageNumber - psalm.pageNumber);
      const pairScore = Math.min(1, (psalm.score * 0.56) + (gospel.score * 0.44) + proximityBonus(distance) * 0.35);
      pairs.push({ psalm, gospel: { ...gospel, distance }, pairScore, distance });
    }
    pairs.sort((a,b)=>b.pairScore-a.pairScore || b.psalm.score-a.psalm.score || b.gospel.score-a.gospel.score || a.distance-b.distance || a.psalm.pageNumber-b.psalm.pageNumber);
    const best = pairs[0] || null;
    const psalmFound = Boolean(best && best.psalm.score >= 0.5);
    const gospelFound = Boolean(best && best.gospel.score >= 0.38);
    const complete = Boolean(best && psalmFound && gospelFound && best.pairScore >= 0.53);
    const psalm = {
      found: complete,
      pageNumber: complete ? best.psalm.pageNumber : null,
      score: best?.psalm?.score || 0,
      baseScore: best?.psalm?.score || 0,
      candidates: psalmCandidates.slice(0,8)
    };
    const gospel = {
      found: complete,
      pageNumber: complete ? best.gospel.pageNumber : null,
      score: best?.gospel?.score || 0,
      baseScore: best?.gospel?.score || 0,
      distance: best?.distance ?? null,
      candidates: best ? [best.gospel] : []
    };
    const foundPages = complete ? [best.psalm.pageNumber, best.gospel.pageNumber] : [];
    return {
      psalm,
      gospel,
      complete,
      weeklyBlock: complete ? {
        startPage: Math.min(...foundPages),
        endPage: Math.max(...foundPages),
        psalmPage: best.psalm.pageNumber,
        gospelPage: best.gospel.pageNumber
      } : null,
      pairCandidates: pairs.slice(0,8),
      strategy: complete ? 'paired-psalm-gospel-text' : 'paired-psalm-gospel-not-confirmed'
    };
  }

  function locateWeeklySourceBlock(pages, input = {}) {
    const context = {
      date: input.date,
      celebration: input.celebration,
      celebrationTitle: input.celebrationTitle,
      sourceData: input.sourceData
    };
    const contextAnchor = chooseContextAnchorPage(pages, context, input);
    if (!contextAnchor.found) {
      const paired = locateBestPsalmGospelPair(pages, input);
      if (paired.complete) return { ...paired, contextAnchor };
    }
    let psalm = contextAnchor.found
      ? choosePageNearAnchor(
          pages,
          sectionTarget(input.sourceData, 'psalm'),
          contextAnchor.pageNumber,
          context,
          { ...input, windowBefore: 1, windowAfter: 4, threshold: 0.46 }
        )
      : choosePsalmAnchorPage(pages, input.sourceData, context, input);

    // Once the celebration/date block is found, do NOT jump to a distant Psalm
    // elsewhere in the annual book. A remote match may belong to another feast.
    // The director can confirm the missing page manually if the local block is unreadable.
    if (!psalm.found) {
      return {
        psalm,
        gospel: { found: false, pageNumber: null, score: 0, baseScore: 0, distance: null, candidates: [] },
        complete: false,
        weeklyBlock: null,
        strategy: contextAnchor.found ? 'context-anchor-psalm-not-found' : 'psalm-anchor-not-found'
      };
    }

    const gospel = choosePageNearAnchor(
      pages,
      sectionTarget(input.sourceData, 'gospel'),
      psalm.pageNumber,
      context,
      input
    );
    const pagesFound = [psalm.pageNumber, gospel.pageNumber].filter(Number.isFinite);
    return {
      psalm,
      gospel,
      complete: psalm.found && gospel.found,
      weeklyBlock: pagesFound.length ? {
        startPage: Math.min(...pagesFound),
        endPage: Math.max(...pagesFound),
        psalmPage: psalm.pageNumber,
        gospelPage: gospel.pageNumber,
        windowBefore: Number.isFinite(input.windowBefore) ? input.windowBefore : DEFAULT_WINDOW_BEFORE,
        windowAfter: Number.isFinite(input.windowAfter) ? input.windowAfter : DEFAULT_WINDOW_AFTER
      } : null,
      strategy: gospel.found ? 'psalm-anchored-weekly-block' : 'psalm-found-acclamation-not-confirmed-nearby'
    };
  }

  function firstPageFromRange(value) {
    const match = String(value || '').match(/\d+/);
    return match ? Number(match[0]) : null;
  }

  function pdfPageFragment(value) {
    const page = firstPageFromRange(value);
    return page ? `#page=${page}&zoom=page-width` : '';
  }

  async function loadPdfJs(dependencies = {}) {
    const supplied = dependencies.pdfjsLib || global?.pdfjsLib;
    if (supplied?.getDocument) return supplied;
    if (!pdfJsPromise) {
      pdfJsPromise = import(PDFJS_MODULE_URL).then((module) => {
        const pdfjs = module?.default?.getDocument ? module.default : module;
        if (pdfjs?.GlobalWorkerOptions) pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
        return pdfjs;
      });
    }
    const pdfjs = await pdfJsPromise;
    if (!pdfjs?.getDocument) throw new Error('PDF text reader could not be loaded.');
    return pdfjs;
  }

  async function readArrayBuffer(file) {
    if (!file) throw new Error('No PDF file was selected.');
    if (typeof file.arrayBuffer === 'function') return file.arrayBuffer();
    if (file instanceof ArrayBuffer) return file;
    if (ArrayBuffer.isView(file)) return file.buffer.slice(file.byteOffset, file.byteOffset + file.byteLength);
    throw new Error('The selected PDF cannot be read.');
  }

  async function extractPdfPageTexts(file, options = {}, dependencies = {}) {
    if (textCache?.has(file) && options.useCache !== false) return textCache.get(file);

    const pdfjs = await loadPdfJs(dependencies);
    const bytes = await readArrayBuffer(file);
    const loadingTask = pdfjs.getDocument({
      data: new Uint8Array(bytes),
      isEvalSupported: false,
      useSystemFonts: true
    });
    const document = await loadingTask.promise;
    const pages = [];
    let textPageCount = 0;

    try {
      for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {
        const page = await document.getPage(pageNumber);
        const content = await page.getTextContent({ normalizeWhitespace: true, disableCombineTextItems: false });
        const items = Array.from(content?.items || []);
        const text = items
          .map((item) => item?.str || '')
          .join(' ')
          .replace(/\s+/g, ' ')
          .trim();
        const lines = groupTextItemsIntoLines(items);
        if (text) textPageCount += 1;
        pages.push({ pageNumber, text, lines });
        options.onProgress?.({ pageNumber, totalPages: document.numPages, textPageCount });
        page.cleanup?.();
      }
    } finally {
      await document.destroy?.();
    }

    const result = { pages, pageCount: pages.length, textPageCount };
    if (textCache && options.useCache !== false) textCache.set(file, result);
    return result;
  }

  function publisherMappedPair(sourceData, pageCount) {
    const psalmPage = Number(sourceData?.psalm?.pdfPage || 0) || null;
    const gospelPage = Number(sourceData?.gospel?.pdfPage || 0) || null;
    const psalmEndPage = Number(sourceData?.psalm?.pdfPageEnd || sourceData?.psalm?.pageEnd || 0) || psalmPage;
    if (!psalmPage || !gospelPage) return null;
    if (Number.isFinite(pageCount) && (psalmPage > pageCount || gospelPage > pageCount || psalmEndPage > pageCount)) return null;
    const startPage = Math.min(psalmPage, gospelPage);
    const endPage = Math.max(psalmEndPage || psalmPage, gospelPage);
    return {
      psalm: { found:true, pageNumber:psalmPage, endPage:psalmEndPage, score:1, baseScore:1, candidates:[{pageNumber:psalmPage,score:1,source:'publisher-map'}] },
      gospel: { found:true, pageNumber:gospelPage, score:1, baseScore:1, distance:Math.abs(gospelPage-psalmPage), candidates:[{pageNumber:gospelPage,score:1,source:'publisher-map'}] },
      complete:true,
      weeklyBlock:{ startPage, endPage, psalmPage, psalmEndPage, gospelPage },
      strategy:'publisher-page-map'
    };
  }

  async function locatePsalmAndAcclamationPages(input = {}, dependencies = {}) {
    const sourceData = input.sourceData;
    const hasExactLiturgicalData = Boolean(sourceData?.psalm && sourceData?.gospel);

    const extraction = await extractPdfPageTexts(input.file, {
      onProgress: input.onProgress,
      useCache: input.useCache
    }, dependencies);

    const noSelectableText = extraction.pageCount > 0 && extraction.textPageCount === 0;
    // When the celebration record contains publisher-verified physical PDF pages,
    // that map is more authoritative than fuzzy text extraction.  This is crucial
    // for RYA layouts where a Psalm spans two pages and the second page also carries
    // the Alleluia: PDF.js may not reconstruct a standalone Gospel heading even
    // though the correct weekly pair is already known.
    const publisherPair = publisherMappedPair(sourceData, extraction.pageCount);
    const located = publisherPair || (noSelectableText
      ? {
          psalm: { found: false, pageNumber: null, score: 0, baseScore: 0, candidates: [] },
          gospel: { found: false, pageNumber: null, score: 0, baseScore: 0, distance: null, candidates: [] },
          complete: false,
          weeklyBlock: null,
          strategy: 'no-selectable-text'
        }
      : (hasExactLiturgicalData
          ? locateWeeklySourceBlock(extraction.pages, input)
          : locateCelebrationSections(extraction.pages, input)));

    const liturgicalText = noSelectableText && !publisherPair ? null : extractLiturgicalTextFromLocatedPages(extraction.pages, located, input.language);

    return {
      ...located,
      pageCount: extraction.pageCount,
      textPageCount: extraction.textPageCount,
      noSelectableText,
      liturgicalText
    };
  }

  const api = {
    PDFJS_MODULE_URL,
    PDFJS_WORKER_URL,
    DEFAULT_THRESHOLD,
    DEFAULT_PSALM_THRESHOLD,
    DEFAULT_GOSPEL_THRESHOLD,
    DEFAULT_WINDOW_BEFORE,
    DEFAULT_WINDOW_AFTER,
    normalizeText,
    numericTokens,
    significantTokens,
    tokenCoverage,
    numberCoverage,
    sectionTarget,
    scorePageText,
    rankPageTexts,
    chooseBestPage,
    buildDateAnchors,
    contextAnchors,
    scoreContextAnchor,
    nearbyPages,
    rankPagesNearAnchor,
    choosePageNearAnchor,
    isStrongIndexPage,
    chooseContextAnchorPage,
    labelCoverage,
    chooseLabeledSectionNearAnchor,
    locateCelebrationSections,
    choosePsalmAnchorPage,
    locateBestPsalmGospelPair,
    locateWeeklySourceBlock,
    publisherMappedPair,
    firstPageFromRange,
    pdfPageFragment,
    groupTextItemsIntoLines,
    normalizeLiturgicalLyric,
    extractLiturgicalTextFromLocatedPages,
    loadPdfJs,
    extractPdfPageTexts,
    locatePsalmAndAcclamationPages
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (global) global.ScoreBankPdfPageLocator = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  <script>
(function initializeCompiledMassSettingResolver(global) {
  'use strict';

  const ORDER = Object.freeze(['kyrie','gloria','holy','memorial','amen','lamb']);
  const TERMS = Object.freeze({
    kyrie: Object.freeze({ strong:['kyrie','lord have mercy','a lenten prayer'], weak:['mercy'] }),
    gloria: Object.freeze({ strong:['gloria','glory to god','a new mass for congregation'], weak:['glory'] }),
    holy: Object.freeze({ strong:['holy holy holy','sanctus','holy'], weak:[] }),
    memorial: Object.freeze({ strong:['memorial acclamation','mystery of faith'], weak:['we proclaim your death','when we eat this bread','save us savior'] }),
    amen: Object.freeze({ strong:['great amen'], weak:['amen'] }),
    lamb: Object.freeze({ strong:['lamb of god','agnus dei'], weak:['lamb'] })
  });

  function normalize(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function linesFor(page) {
    const lines = Array.isArray(page?.lines) ? page.lines.map((line) => String(line?.text || '')) : [];
    if (lines.length) return lines;
    return String(page?.text || '').split(/\n+/).filter(Boolean);
  }

  function lineScore(line, part) {
    const n = normalize(line);
    if (!n) return 0;
    const spec = TERMS[part] || { strong:[], weak:[] };
    let best = 0;
    for (const phrase of spec.strong) {
      const p = normalize(phrase);
      if (!p) continue;
      if (n === p) best = Math.max(best, 9);
      else if (n.startsWith(`${p} `) || n.endsWith(` ${p}`)) best = Math.max(best, 7);
      else if (n.includes(p) && n.length <= Math.max(90, p.length * 4)) best = Math.max(best, 5);
    }
    for (const phrase of spec.weak) {
      const p = normalize(phrase);
      if (!p) continue;
      if (part === 'amen' && n === 'amen') best = Math.max(best, 4);
      else if (n === p || n.startsWith(`${p} `)) best = Math.max(best, 3);
    }
    return best;
  }

  function pageScore(page, part) {
    const lines = linesFor(page);
    let score = 0;
    for (const line of lines) score = Math.max(score, lineScore(line, part));
    const text = normalize(page?.text || lines.join(' '));
    const spec = TERMS[part] || { strong:[], weak:[] };
    for (const phrase of spec.strong) {
      const p = normalize(phrase);
      if (p && text.includes(p)) score = Math.max(score, 2.5);
    }
    return score;
  }

  function pageLooksLikeContents(page) {
    const text = normalize(page?.text || linesFor(page).join(' '));
    if (/\b(table of contents|contents|index|indice|contenido)\b/.test(text)) {
      const headingHits = ORDER.filter((part) => pageScore(page, part) >= 5).length;
      if (headingHits >= 3) return true;
    }
    const headingHits = ORDER.filter((part) => pageScore(page, part) >= 7).length;
    return headingHits >= 4;
  }

  function candidatePages(pages, part) {
    return Array.from(pages || [])
      .map((page) => ({ pageNumber:Number(page?.pageNumber || 0), score:pageScore(page, part), indexLike:pageLooksLikeContents(page) }))
      .filter((item) => item.pageNumber > 0 && item.score >= 3 && !item.indexLike)
      .sort((a,b) => b.score - a.score || a.pageNumber - b.pageNumber)
      .slice(0, 12);
  }

  function locateStarts(pages) {
    const candidates = Object.fromEntries(ORDER.map((part) => [part, candidatePages(pages, part)]));
    const memo = new Map();
    function solve(index, previousPage) {
      const cacheKey = `${index}:${previousPage}`;
      if (memo.has(cacheKey)) return memo.get(cacheKey);
      if (index >= ORDER.length) return { score:0, picks:[] };
      const part = ORDER[index];
      let best = { score:-1000, picks:[] };
      const options = candidates[part].filter((item) => item.pageNumber >= previousPage);
      // Allow a missing heading at a cost. Later inference can fill a one-page gap.
      const choices = [...options, null];
      for (const choice of choices) {
        const nextPrevious = choice ? choice.pageNumber : previousPage;
        const tail = solve(index + 1, nextPrevious);
        const duplicatePenalty = choice && choice.pageNumber === previousPage && index > 0 ? 2.25 : 0;
        const contribution = choice ? choice.score - duplicatePenalty : -4;
        const total = contribution + tail.score;
        if (total > best.score) best = { score:total, picks:[choice, ...tail.picks] };
      }
      memo.set(cacheKey, best);
      return best;
    }
    const solved = solve(0, 1);
    const starts = {};
    ORDER.forEach((part, index) => {
      const pick = solved.picks[index];
      if (pick) starts[part] = pick.pageNumber;
    });

    // Great Amen is sometimes headed simply "Amen". If the strong heading was
    // not extractable, infer the page immediately before Lamb of God when that
    // page falls after the Memorial Acclamation.

    page.drawText(safeText, {
      x: Math.max(42, (pageWidth - width) / 2),
      y,
      size,
      font
    });
  }


  function resolveCelebrationSymbolKind(book = {}) {
    const explicit = String(book.symbolKind || '').toLowerCase();
    if (['cross', 'rings', 'church'].includes(explicit)) return explicit;
    const type = String(book.celebrationType || '').toLowerCase();
    const title = String(book.celebrationTitle || '').toLowerCase();
    if (type === 'funeral' || type.startsWith('funeral-') || /\b(funeral|difunt|requiem|misa memorial)\b/.test(title)) return 'cross';
    if (type.includes('wedding') || type.includes('anniversary') || /\b(boda|wedding|aniversario de bodas?|wedding anniversary)\b/.test(title)) return 'rings';
    return 'church';
  }

  function drawCelebrationSymbol(page, book, PDFLib, pageWidth = 612) {
    const { rgb } = PDFLib;
    const color = rgb(0.09, 0.125, 0.2);
    const kind = resolveCelebrationSymbolKind(book);
    const cx = pageWidth / 2;
    const cy = 758;
    const line = (x1, y1, x2, y2, thickness = 1.8) => page.drawLine({ start: { x: x1, y: y1 }, end: { x: x2, y: y2 }, thickness, color });

    if (kind === 'cross') {
      line(cx, cy - 17, cx, cy + 17, 2.4);
      line(cx - 10, cy + 7, cx + 10, cy + 7, 2.4);
      return kind;
    }

    if (kind === 'rings') {
      page.drawCircle({ x: cx - 6.5, y: cy, size: 9.5, borderColor: color, borderWidth: 1.8 });
      page.drawCircle({ x: cx + 6.5, y: cy, size: 9.5, borderColor: color, borderWidth: 1.8 });
      line(cx - 3, cy + 11, cx, cy + 16, 1.4);
      line(cx, cy + 16, cx + 3, cy + 11, 1.4);
      return kind;
    }

    // Classic church: nave, roof, central tower/cross, and doorway.
    page.drawRectangle({ x: cx - 14, y: cy - 13, width: 28, height: 19, borderColor: color, borderWidth: 1.6 });
    line(cx - 16, cy + 6, cx, cy + 18, 1.6);
    line(cx, cy + 18, cx + 16, cy + 6, 1.6);
    page.drawRectangle({ x: cx - 4, y: cy - 13, width: 8, height: 10, borderColor: color, borderWidth: 1.4 });
    line(cx, cy + 18, cx, cy + 27, 1.5);
    line(cx - 4, cy + 23, cx + 4, cy + 23, 1.5);
    return kind;
  }

  function cleanIndexDisplayTitle(value) {
    let text = toPdfText(value).replace(/\s+/g, ' ').trim();
    if (!text) return '';

    // Catalogue codes are useful while choosing repertoire but make the one-page
    // INDEX hard to read. Strip them only from the cover display, never from the
    // stored selection or the assembled source files.
    text = text.replace(/\s+(?:SONG OF PRAISE OR SENDING FORTH|SENDING FORTH|CANTO DE SALIDA|SALIDA\s*\/\s*RECESIONAL).*$/i, '').trim();
    const catalogue = /\s+(?:A|AC|C2|FC\d*|MD|VOZ|BB\s*\/\s*MI(?:\s*\/\s*TP)?|BB|MI(?:\s*\/\s*TP)?|TP|CP\d*|GP\d*|H|J\d*|NTY|R\d*|S&S|SS\d*|UC|OCP|GC|G|W|JS)\s*#?\d+\b/i.exec(text);
    if (catalogue && catalogue.index > 0) {
      text = text.slice(0, catalogue.index).trim();
    }
    const longCode = /\s+e\s+\d{5,}\b/i.exec(text);
    if (longCode && longCode.index > 0) text = text.slice(0, longCode.index).trim();
    text = text.replace(/\s*\((?:FULL|PIANO|LEAD(?:\s+SHEET)?|LS|SATB|CHOIR|CORO|ENGLISH|SPANISH|BILINGUAL|ENG[- ]?SPA|INSTRUMENTAL|ACCOMPANIMENT)\)\s*$/i, '').trim();
    text = text.replace(/\s+(?:LEAD\s+SHEET|PIANO|FULL|SATB|CHOIR|INSTRUMENTAL)\s*$/i, '').trim();
    return text;
  }

  function createIndexRowLayout(item, boldFont, regularFont) {
    const labelSize = 8.1;
    const titleSize = 9.0;
    const lineHeight = 10.5;
    const labelWidth = 158;
    const titleWidth = 300;
    const labelLines = wrapText(String(item?.label || item?.key || ''), boldFont, labelSize, labelWidth);
    const psalmResponse = item?.key === 'psalm' ? String(item?.liturgicalResponse || '').trim() : '';
    const psalmReference = psalmResponse ? String(item?.liturgicalReference || '').trim() : '';
    const titleLines = psalmResponse ? [] : wrapText(cleanIndexDisplayTitle(item?.title || ''), regularFont, titleSize, titleWidth);
    const referenceLines = psalmResponse ? wrapText(psalmReference, regularFont, 8.4, titleWidth) : [];
    const responseLines = psalmResponse ? wrapText(psalmResponse, boldFont, 10.2, titleWidth) : [];
    const psalmLineCount = referenceLines.length + responseLines.length;
    const lineCount = Math.max(labelLines.length, psalmResponse ? psalmLineCount : titleLines.length, 1);
    const rowHeight = Math.max(31, 13 + (lineCount * lineHeight));
    return { labelLines, titleLines, referenceLines, responseLines, psalmResponse, labelSize, titleSize, lineHeight, rowHeight, labelWidth, titleWidth };
  }

  function buildIndexCoverRows(book, plan, pageStarts) {
    const sectionMap = new Map(Array.from(book?.sections || []).map((section) => [section.key, section]));
    const locatedRows = [];

    for (let index = 0; index < plan.length; index += 1) {
      const item = plan[index];
      const startPage = Number(pageStarts[index] || 2);
      const components = Array.from(item?.components || []);

      if (components.length <= 1) {
        const key = String(item?.key || components[0]?.key || '');
        const section = sectionMap.get(key) || item;
        locatedRows.push({
          key,
          label: section?.label || item?.label || key,
          title: section?.title || item?.title || '',
          liturgicalReference: section?.liturgicalReference || item?.liturgicalReference || '',
          liturgicalResponse: section?.liturgicalResponse || item?.liturgicalResponse || '',
          pageNumber: startPage
        });
        continue;
      }

      for (const component of components) {
        const key = String(component?.key || '');
        const section = sectionMap.get(key) || component;
        const componentPages = Array.from(component.pageIndices || []);
        const firstSourcePage = componentPages.length ? componentPages[0] : null;
        const sourcePages = Array.from(item.pageIndices || []);
        const rawOffset = firstSourcePage == null ? 0 : sourcePages.indexOf(firstSourcePage);
        const offset = rawOffset < 0 ? 0 : rawOffset;
        locatedRows.push({
          key,
          label: section?.label || component?.label || key,
          title: section?.title || component?.title || '',
          liturgicalReference: section?.liturgicalReference || component?.liturgicalReference || '',
          liturgicalResponse: section?.liturgicalResponse || component?.liturgicalResponse || '',
          pageNumber: startPage + offset
        });
      }
    }

    // The INDEX follows the liturgical order defined by the Mass Book, not the
    // accidental order in which files were merged or bundled during assembly.
    const byKey = new Map();
    for (const row of locatedRows) if (row.key && !byKey.has(row.key)) byKey.set(row.key, row);
    const ordered = [];
    for (const section of Array.from(book?.sections || [])) {
      const row = byKey.get(section.key);
      if (!row) continue;
      ordered.push({ ...row, label: section.label || row.label, title: section.title || row.title });
      byKey.delete(section.key);
    }
    // Preserve any unexpected/custom sections after the standard liturgical rows.
    for (const row of locatedRows) if (byKey.has(row.key)) { ordered.push(row); byKey.delete(row.key); }
    return ordered;
  }

  function drawIndexCover(pdfDoc, book, plan, pageStarts, PDFLib) {
    const { StandardFonts, rgb } = PDFLib;
    const pageWidth = 612;
    const pageHeight = 792;
    const margin = 44;
    const page = pdfDoc.addPage([pageWidth, pageHeight]);
    const regular = pdfDoc.embedFont(StandardFonts.Helvetica);
    const bold = pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const serifBold = pdfDoc.embedFont(StandardFonts.TimesRomanBold);

    return Promise.all([regular, bold, serifBold]).then(([regularFont, boldFont, titleFont]) => {
      const green = rgb(0.094, 0.475, 0.306);
      const navy = rgb(0.09, 0.125, 0.2);
      const gray = rgb(0.38, 0.42, 0.49);
      const light = rgb(0.94, 0.95, 0.97);

      drawCelebrationSymbol(page, book, PDFLib, pageWidth);
      page.drawRectangle({ x: margin, y: 728, width: pageWidth - (margin * 2), height: 2, color: green });

      const titleLines = wrapText(book.celebrationTitle || book.labels?.celebration || 'Celebration', titleFont, 22, pageWidth - (margin * 2));
      let y = 690;
      for (const line of titleLines.slice(0, 3)) {
        drawCentered(page, line, titleFont, 22, y, pageWidth);
        y -= 26;
      }

      drawCentered(page, book.formattedDate || book.date || '', regularFont, 12, y - 2, pageWidth);
      if(book.time){
        drawCentered(page, `${book.labels?.time || 'Time'}: ${book.time}`, regularFont, 10, y - 18, pageWidth);
        drawCentered(page, book.languageName || '', boldFont, 10, y - 34, pageWidth);
        drawCentered(page, book.parish || '', boldFont, 12, y - 50, pageWidth);
        y -= 78;
      }else{
        drawCentered(page, book.languageName || '', boldFont, 10, y - 18, pageWidth);
        drawCentered(page, book.parish || '', boldFont, 12, y - 34, pageWidth);
        y -= 62;
      }

      // Build 107: keep the INDEX cover intentionally clean. The celebration,
      // date/language/parish remain above; season/cycle/Mass Setting metadata
      // stays available inside ScoreBank but is no longer repeated on the INDEX.
      y -= 10;
      drawCentered(page, 'INDEX', boldFont, 13, y, pageWidth);
      y -= 18;

      const coverRows = buildIndexCoverRows(book, plan, pageStarts);
      for (let index = 0; index < coverRows.length; index += 1) {
        const item = coverRows[index];
        const layout = createIndexRowLayout(item, boldFont, regularFont);
        if (y - layout.rowHeight < 58) {
          break;
        }

        page.drawRectangle({
          x: margin,
          y: y - layout.rowHeight,
          width: pageWidth - (margin * 2),
          height: layout.rowHeight,
          color: index % 2 === 0 ? light : rgb(1, 1, 1),
          borderColor: rgb(0.78, 0.81, 0.86),
          borderWidth: 0.6
        });

        const pageNumber = item.pageNumber || 2;
        const firstBaseline = y - 13;
        const labelX = margin + 8;
        const titleX = margin + 176;
        const pageNumberX = pageWidth - margin - 24;

        layout.labelLines.forEach((line, lineIndex) => {
          page.drawText(toPdfText(line), {
            x: labelX,
            y: firstBaseline - (lineIndex * layout.lineHeight),
            size: layout.labelSize,
            font: boldFont,
            color: navy
          });
        });

        if (layout.psalmResponse) {
          let textLine = 0;
          layout.referenceLines.forEach((line) => {
            page.drawText(toPdfText(line), {
              x: titleX,
              y: firstBaseline - (textLine * layout.lineHeight),
              size: 8.4,
              font: regularFont,
              color: gray
            });
            textLine += 1;
          });
          layout.responseLines.forEach((line) => {
            page.drawText(toPdfText(line), {
              x: titleX,
              y: firstBaseline - (textLine * layout.lineHeight),
              size: 10.2,
              font: boldFont,
              color: navy
            });
            textLine += 1;
          });
        } else {
          layout.titleLines.forEach((line, lineIndex) => {
            page.drawText(toPdfText(line), {
              x: titleX,
              y: firstBaseline - (lineIndex * layout.lineHeight),
              size: layout.titleSize,
              font: regularFont,
              color: lineIndex === 0 ? navy : gray
            });
          });
        }

        page.drawText(toPdfText(String(pageNumber)), {
          x: pageNumberX,
          y: y - (layout.rowHeight / 2) - 3,
          size: 9.2,
          font: boldFont,
          color: green
        });
        y -= layout.rowHeight + 4;
      }

      page.drawText(toPdfText('ScoreBank · Private library files are processed locally in this browser.'), {
        x: margin,
        y: 35,
        size: 7.2,
        font: regularFont,
        color: gray
      });

      return page;
    });
  }

  async function assembleMassBookPdf(input = {}, dependencies = {}) {
    const PDFLib = dependencies.PDFLib || global?.PDFLib;
    if (!PDFLib?.PDFDocument) {
      throw new Error('PDF engine unavailable. Connect to the internet once and reload ScoreBank.');
    }

    const resolver = dependencies.resolver || global?.ScoreBankLibraryMatchResolver;
    if (!resolver?.parsePageRange) {
      throw new Error('Library Match Resolver is unavailable.');
    }

    const book = input.book;
    const plan = createAssemblyPlan(input);
    if (!book || !plan.length) {
      throw new Error('No matched PDF files are ready to assemble.');
    }

    const loaded = [];
    const omitted = [];
    for (const item of plan) {
      try {
        const source = await loadSourceForAssembly(item, { ...dependencies, PDFLib });
        if (shouldOmitUnsafeOptionalWholeDocument(item, source.sourcePageCount)) {
          omitted.push({
            key: item.key,
            label: item.label,
            title: item.title,
            relativePath: item.relativePath,
            pageCount: source.sourcePageCount,
            reason: 'optional-multipage-whole-document-blocked'
          });
          if (source.mode === 'raster') await source.pdfJsDocument?.destroy?.();
          continue;
        }
        let requestedPages = null;
        try {
          requestedPages = resolver.parsePageRange(item.pageRange, source.sourcePageCount);
        } catch (error) {
          const canUseWholeWeeklyFile = item.allowWholeDocumentFallback
            && source.sourcePageCount <= 6
            && /exceeds the PDF page count/i.test(String(error?.message || ''));
          if (!canUseWholeWeeklyFile) throw error;
        }
        const pageIndices = requestedPages || Array.from({ length: source.sourcePageCount }, (_, index) => index);
        const components = Array.from(item.components || []).map((component) => {
          let componentPageIndices = [];
          try {
            componentPageIndices = resolver.parsePageRange(component.pageRange, source.sourcePageCount) || [];
          } catch (error) {
            componentPageIndices = [];
          }
          return { ...component, pageIndices: componentPageIndices };
        });
        loaded.push({ ...item, ...source, pageIndices, components });
      } catch (error) {
        const filename = item.relativePath || item.file?.name || item.title;
        throw new Error(`Could not read “${filename}”: ${error.message}`);
      }
    }

    const pageStarts = [];
    let nextPage = 2;
    for (const item of loaded) {
      pageStarts.push(nextPage);
      nextPage += item.pageIndices.length;
    }

    try {
      const initialMode = chooseInitialStandardizationMode(loaded);
      let standardized = await buildStandardizedMassBookOutput(
        book,
        loaded,
        pageStarts,
        PDFLib,
        dependencies,
        { mode: initialMode, profile: PRINT_EMAIL_PROFILE }
      );

      let compactRetry = false;
      if (shouldRetryCompactStandardization(standardized.bytes.byteLength)) {
        compactRetry = true;
        standardized = await buildStandardizedMassBookOutput(
          book,
          loaded,
          pageStarts,
          PDFLib,
          dependencies,
          { mode: 'raster', profile: COMPACT_EMAIL_PROFILE }
        );
      }

      const bytes = standardized.bytes;
      return {
        bytes,
        filename: buildDownloadName(book),
        pageCount: standardized.pageCount,
        fileSizeBytes: bytes.byteLength,
        fileSizeMB: Number((bytes.byteLength / (1024 * 1024)).toFixed(1)),
        standardization: {
          automatic: true,
          pageSize: 'US Letter 8.5 x 11 in',
          marginPoints: STANDARD_PAGE_MARGIN,
          mode: standardized.mode,
          profile: standardized.profile.name,
          dpi: standardized.mode === 'raster' ? standardized.profile.dpi : null,
          jpegQuality: standardized.mode === 'raster' ? standardized.profile.jpegQuality : null,
          compactRetry,
          emailSafeTargetBytes: EMAIL_SAFE_TARGET_BYTES,
          rasterizedPageCount: standardized.rasterizedPageCount,
          nativeFallbackPageCount: standardized.nativeFallbackPageCount
        },
        encryptedSections: loaded.filter((item) => item.ignoredEncryption).map((item) => ({
          key: item.key,
          label: item.label,
          title: item.title,
          relativePath: item.relativePath
        })),
        rasterizedSections: loaded.filter((item) => item.mode === 'raster').map((item) => ({
          key: item.key,
          label: item.label,
          title: item.title,
          relativePath: item.relativePath,
          reason: item.compatibilityReason
        })),
        omittedSections: omitted,
        includedSections: loaded.map((item, index) => ({
          key: item.key,
          label: item.label,
          title: item.title,
          relativePath: item.relativePath,
          pageRange: item.pageRange,
          startingPage: pageStarts[index],
          copiedPages: item.pageIndices.length,
          mode: item.mode
        }))
      };
    } finally {
      for (const item of loaded) {
        if (item.mode === 'raster') await item.pdfJsDocument?.destroy?.();
        if (item._standardizationPdfJsDocument && item._standardizationPdfJsDocument !== item.pdfJsDocument) {
          await item._standardizationPdfJsDocument?.destroy?.();
        }
      }
    }
  }

  function downloadPdfBytes(bytes, filename, windowRef) {
    const targetWindow = windowRef || global?.window || global;
    if (!targetWindow?.document || !targetWindow?.URL || typeof targetWindow.Blob !== 'function') {
      return { ok: false, reason: 'download-unavailable' };
    }

    const blob = new targetWindow.Blob([bytes], { type: 'application/pdf' });
    const url = targetWindow.URL.createObjectURL(blob);
    const anchor = targetWindow.document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    anchor.style.display = 'none';
    targetWindow.document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    targetWindow.setTimeout(() => targetWindow.URL.revokeObjectURL(url), 30000);
    return { ok: true, url, filename };
  }

  async function assembleAndDownload(input = {}, dependencies = {}) {
    const result = await assembleMassBookPdf(input, dependencies);
    const download = downloadPdfBytes(result.bytes, result.filename, dependencies.windowRef);
    return { ...result, download };
  }

  const api = {
    sanitizeFilename,
    buildDownloadName,
    isEncryptedPdfError,
    isPdfLibStructuralError,
    readPdfBytes,
    loadPdfDocument,
    loadPdfJsDocument,
    loadSourceForAssembly,
    dataUrlToBytes,
    canvasToPngBytes,
    canvasToJpegBytes,
    createRenderCanvas,
    rasterizePdfJsPage,
    fitPageIntoStandardLetter,
    estimateSelectedSourceBytes,
    chooseInitialStandardizationMode,
    shouldRetryCompactStandardization,
    rasterizePdfJsPageToJpeg,
    buildStandardizedMassBookOutput,
    mergePageRanges,
    shouldOmitUnsafeOptionalWholeDocument,
    createAssemblyPlan,
    buildPsalmAcclamationDownloadName,
    createPsalmAcclamationExtractionPlan,
    extractPsalmAcclamationPdf,
    extractAndDownloadPsalmAcclamation,
    wrapText,
    toPdfText,
    cleanIndexDisplayTitle,
    resolveCelebrationSymbolKind,
    drawCelebrationSymbol,
    createIndexRowLayout,
    buildIndexCoverRows,
    assembleMassBookPdf,
    downloadPdfBytes,
    assembleAndDownload
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  }

  if (global) {
    global.ScoreBankPdfBookAssembler = api;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

function meditationLanguageMatches(item,language=state.language){
  const resolver=window.ScoreBankLibraryMatchResolver;
  const normal=resolver?.normalizeText||((v)=>String(v||'').toLowerCase());
  const requested=String(language||'').toLowerCase().slice(0,2);
  if(!['es','en'].includes(requested))return true;
  const title=String(item?.title||item?.filename||'').replace(/\s+/g,' ').trim();
  const path=String(item?.relativePath||item?.relativeFolder||'');
  const hay=normal(`${title} ${path}`);
  const explicitEs=/\b(?:es|esp|espanol|spanish)\b/.test(hay);
  const explicitEn=/\b(?:en|eng|english)\b/.test(hay);
  if(requested==='es'&&explicitEn&&!explicitEs)return false;
  if(requested==='en'&&explicitEs&&!explicitEn)return false;
  // Strong title-language cues. Neutral proper names remain eligible, but an
  // unmistakably English meditation title must not be suggested in a Spanish Mass
  // (and vice versa).
  const esWords=/\b(?:oracion|meditacion|reflexion|senor|dios|jesus|cristo|santo|santa|san|alma|paz|amor|pobre|nadie|contigo|aqui|escuchame|bendicion|adoracion)\b/g;
  const enWords=/\b(?:prayer|meditation|reflection|lord|believer|blessing|quiet|child|irish|our|father|communion|rite|choir|voice|with|close|saint|hear|adoration)\b/g;
  const esCount=(hay.match(esWords)||[]).length;
  const enCount=(hay.match(enWords)||[]).length;
  if(requested==='es'&&enCount>=1&&enCount>esCount)return false;
  if(requested==='en'&&esCount>=1&&esCount>enCount)return false;
  return true;
}
function meditationLibrarySuggestions(){
  const resolver=window.ScoreBankLibraryMatchResolver;
  const catalog=Array.from(state.libraryCatalog||[]);
  if(!resolver||!catalog.length)return [];
  const keywords=['meditation','reflection','prayer','quiet','adoration','contemplation','meditacion','meditación','reflexion','reflexión','oracion','oración'];
  const rows=[];
  const seen=new Set();
  for(const item of catalog){
    const role=resolver.inferLibraryRole?.(item.relativePath)||'';
    if(!['music','other'].includes(role))continue;
    if(!meditationLanguageMatches(item,state.language))continue;
    const hay=resolver.normalizeText?.(`${item.title||''} ${item.relativeFolder||''}`)||'';
    if(!keywords.some(k=>hay.includes(resolver.normalizeText?.(k)||k)))continue;
    // The Communion Rite / Lord's Prayer is a distinct optional liturgical slot,
    // not a meditation suggestion. Keep it out even though its filename contains
    // the generic word "prayer".
    if(/\b(?:communion rite|lord s prayer|our father|rito de comunion|padre nuestro)\b/.test(hay) &&
       !/\b(?:meditation|meditacion|reflection|reflexion|adoration|adoracion)\b/.test(hay))continue;
    const title=String(item.title||item.filename||'').replace(/\s+/g,' ').trim();
    const key=resolver.normalizeText?.(title)||title.toLowerCase();
    if(!title||seen.has(key))continue;
    seen.add(key); rows.push(title);
  }
  const current=String(state.index.meditation||'').trim();
  if(current&&!seen.has(resolver.normalizeText?.(current)||current.toLowerCase()))rows.unshift(current);
  return rows.slice(0,30);
}

function ebookPageLooksLikeIndex(text){
  const n=window.ScoreBankLibraryMatchResolver?.normalizeText?.(text)||String(text||'').toLowerCase();
  if(!n)return false;
  if(/\b(topical index|indice tematico|alphabetical index|indice alfabetico|song index|hymn index|index of titles|indice de titulos)\b/.test(n))return true;
  const catalogueHits=(String(text||'').match(/\b(?:OCP|G3|GP3|CP3|CP4|BB|MI|UC|VOZ|FC\d?|MD|A)\s*#?\d{2,}\b/gi)||[]).length;
  const shortLines=String(text||'').split(/\n+/).filter(line=>line.trim()).length;
  return catalogueHits>=18&&shortLines>=8;
}
function ebookPageMatchScore(query,text){
  const normalize=window.ScoreBankLibraryMatchResolver?.normalizeText||((v)=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim());
  const q=normalize(query),t=normalize(text);
  if(!q||!t)return 0;
  if(t.includes(q))return 1;
  const words=q.split(/\s+/).filter(w=>w.length>2);
  if(!words.length)return 0;
  const hits=words.filter(w=>t.includes(w)).length;
  return hits/words.length;
}
async function searchManualSongEbooks(moment,query){
  const q=String(query||'').trim();
  state.manualSongBookMatches=state.manualSongBookMatches||{};
  state.manualSongBookStatus=state.manualSongBookStatus||{};
  if(!q){delete state.manualSongBookMatches[moment];delete state.manualSongBookStatus[moment];return [];}
  const locator=window.ScoreBankPdfPageLocator;
  const books=ebookCatalogForManualSong(q);
  if(!locator?.extractPdfPageTexts||!books.length){state.manualSongBookMatches[moment]=[];state.manualSongBookStatus[moment]='done';return [];}
  state.manualSongBookStatus[moment]='working';
  state.manualSongBookMatches[moment]=[];
  const found=[];
  for(const book of books){
    if(found.length>=24)break;
    try{
      const extracted=await locator.extractPdfPageTexts(book.file,{useCache:true});
      for(const page of extracted?.pages||[]){
        if(ebookPageLooksLikeIndex(page.text||'')||locator.isStrongIndexPage?.(page.text||''))continue;
        const score=ebookPageMatchScore(q,page.text||'');
        if(score<0.78)continue;
        found.push({relativePath:book.relativePath,title:book.title||book.filename,page:Number(page.pageNumber||0),score,source:'ebook'});
        if(found.length>=24)break;
      }
    }catch{}
  }
  found.sort((a,b)=>b.score-a.score||a.relativePath.localeCompare(b.relativePath)||a.page-b.page);
  state.manualSongBookMatches[moment]=found;
  state.manualSongBookStatus[moment]='done';
  return found;
}

function updateFuneralLiturgicalTitleFromCandidate(section,candidate){
  if(!candidate||!['psalm','gospel'].includes(section))return;
  const current=String(state.index?.[section]||'').replace(/\s+/g,' ').trim();
  const candidateTitle=candidateDisplayTitle(candidate);
  const resolver=window.ScoreBankLibraryMatchResolver;
  const role=resolver?.inferLibraryRole?.(candidate.relativePath);
  const isAnnualPsalmSource=role===resolver?.LIBRARY_ROLES?.PSALM_SOURCE&&candidate.source!=='manual-file';
  // Loose scores can be the actual Psalm/Acclamation choice. Annual RYA/R&A
  // books remain sources, so their filename must not replace the liturgical text.
  if(candidateTitle&&!isAnnualPsalmSource){
    state.index[section]=candidateTitle;
    return;
  }
  const normalize=resolver?.normalizeText||((v)=>String(v||'').toLowerCase());
  if(section==='gospel'){
    if(candidateTitle&&(!current||normalize(candidateTitle).includes(normalize(current))||normalize(current).includes(normalize(candidateTitle))))state.index.gospel=candidateTitle;
    return;
  }
  if(candidateTitle&&(!current||/^\s*(?:salmo|psalm)\s*\d{1,3}\s*$/i.test(current))&&normalize(candidateTitle).includes(normalize(current)))state.index.psalm=candidateTitle;
  const author=candidateAuthor(candidate);
  if(author){
    const text=String(state.index.psalm||current||'').trim();
    const escapedAuthor=String(author).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(text&&!new RegExp(`\\(${escapedAuthor}\\)\\s*$`,'i').test(text))state.index.psalm=`${text} (${author})`;
  }
}

function mergeFuneralPsalmSuggestionRows(...groups){
  const out=[];const seen=new Set();
  for(const row of groups.flat()){
    const title=typeof row==='string'?String(row||'').trim():String(row?.title||'').trim();
    if(!title)continue;
    const key=title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    if(!key||seen.has(key))continue;
    seen.add(key);out.push(typeof row==='string'?{title,source:'',page:null}:row);
  }
  return out;
}

function plannerRowsForFuneralMoment(data,moment){
  const allowed=new Set(expectedPlanningFamilies());

// celebration first, then resolve the OCP Psalm + Gospel Acclamation from the
// annual RYA/R&A source. Manual choice is a fallback, never the normal path.
async function ensureAutomaticLiturgicalSourceFromLibrary(options={}){
  if(state.celebrationType!=='calendar'||!state.celebration||!Array.isArray(state.libraryCatalog)||!state.libraryCatalog.length)return false;
  const base=baseSourceFor();
  if(base?.resolved&&base?.psalm&&base?.gospel){state.dynamicLiturgicalSource=null;syncOfficialFields();return true;}
  const engine=window.ScoreBankLiturgicalSourceEngine;
  const locator=window.ScoreBankPdfPageLocator;
  if(!engine?.summarize||!locator?.locatePsalmAndAcclamationPages)return false;
  const year=Number(String(state.date||'').slice(0,4));
  const summary=engine.summarize(state.libraryCatalog,{language:state.language,date:state.date,year,cycle:state.celebration?.cycle||''});
  const row=summary?.preferredPsalm;
  const candidate=row?.candidate;
  if(!candidate?.file)return false;
  try{
    const result=await locator.locatePsalmAndAcclamationPages({
      file:candidate.file,
      sourceData:base,
      language:state.language,
      date:state.date,
      celebration:state.celebration?.celebration||state.celebrationTitle||''
    });
    const p=result?.liturgicalText?.psalm||{};
    const g=result?.liturgicalText?.gospel||{};
    const psalmReference=String(p.reference||'').trim();
    const psalmResponse=String(p.response||'').trim();
    const gospelReference=String(g.reference||'').trim();
    const gospelResponse=String(g.response||'').trim();
    const gospelVerse=String(g.verse||'').trim();
    if(!result?.complete||!(psalmReference||psalmResponse)||!(gospelReference||gospelVerse||gospelResponse))return false;
    const sourceName=state.language==='en'?`Respond & Acclaim ${year}`:`Responde y Aclama ${year}`;
    const sourceProfile=base?.sourceProfile||{id:`${state.language==='en'?'ra':'rya'}-${year}-${String(state.celebration?.cycle||'unknown').toLowerCase()}`,year,cycle:state.celebration?.cycle||null,aliases:state.language==='en'?['Respond & Acclaim','Respond and Acclaim','R&A',sourceName]:['Responde y Aclama','RYA',sourceName]};
    const dynamicSource={
      source:sourceName,
      cycle:state.celebration?.cycle||base?.cycle||null,
      sourceProfile,
      psalm:{page:result.psalm?.pageNumber||null,pdfPage:result.psalm?.pageNumber||null,pdfPageEnd:result.psalm?.endPage||result.psalm?.pageNumber||null,reference:psalmReference,response:psalmResponse},
      gospel:{page:result.gospel?.pageNumber||null,pdfPage:result.gospel?.pageNumber||null,reference:gospelReference,response:gospelResponse||'Alleluia',verse:gospelVerse},
      resolved:true,
      lookupMode:'ocp-annual-library-date',
      celebration:state.celebration?.celebration||state.celebrationTitle||''
    };
    state.dynamicLiturgicalSource={date:state.date,language:state.language,celebrationType:state.celebrationType,source:dynamicSource};
    if(result.psalm?.pageNumber)state.libraryPageRanges.psalm=String(result.psalm.pageNumber);
    if(result.gospel?.pageNumber)state.libraryPageRanges.gospel=String(result.gospel.pageNumber);
    syncOfficialFields();
    persist();
    return true;
  }catch(error){
    if(!options.silent)console.warn('ScoreBank automatic OCP liturgical source lookup failed:',error);
    return false;
  }
}

function purgeStaleLibraryReferences(){
  if(!Array.isArray(state.libraryCatalog)&&!Array.isArray(state.massFolderCatalog))return;
  const resolver=window.ScoreBankLibraryMatchResolver;
  const live=new Set(activeCatalog().map(item=>item.relativePath));
  const massLive=new Set((state.massFolderCatalog||[]).map(item=>item.relativePath));
  const massKeys=new Set(['kyrie','gloria','massSetting','holy','memorial','amen','lamb']);
  for(const [key,path] of Object.entries(state.librarySelections||{})){
    if(MASS_PART_KEYS.includes(key)&&state.compiledMassSettingPath)continue;
    const authoritativeMassFolder=massKeys.has(key)&&massLive.size>0;
    const candidate=findCatalogCandidate(path);
    const missing=path && ((authoritativeMassFolder&&!massLive.has(path))||(!authoritativeMassFolder&&!live.has(path)));
    const manualLiturgicalChoice=manualPsalmAcclamationChoice(key);
    const wrongRole=path && candidate && !manualLiturgicalChoice && candidate.source!=='manual-file' && resolver?.isCandidateAllowedForSection && !resolver.isCandidateAllowedForSection(key,candidate,authoritativeMassFolder);
    if(missing||wrongRole){
      delete state.librarySelections[key];
      delete state.libraryPageRanges[key];
    }
  }
  purgeStaleExtraSelections();
}
const PLANNING_LIBRARY_KEYS=['entrance','gifts','communion','meditation','marian','sending'];
function extraSelectionPaths(section){
  return Array.from(state.librarySelectionExtras?.[section]||[]).map(String).filter(Boolean);
}
function extraSelectionPageRange(section,path){
  return String(state.librarySelectionExtraPageRanges?.[`${section}::${path}`]||'').trim();
}
function setExtraSelection(section,path,enabled,pageRange=''){
  if(!PLANNING_LIBRARY_KEYS.includes(section)||!path)return;
  state.librarySelectionExtras=state.librarySelectionExtras||{};
  state.librarySelectionExtraPageRanges=state.librarySelectionExtraPageRanges||{};
  const values=new Set(extraSelectionPaths(section));
  if(enabled)values.add(path);else values.delete(path);
  const primary=String(state.librarySelections?.[section]||'');
  if(primary)values.delete(primary);
  state.librarySelectionExtras[section]=[...values];
  const key=`${section}::${path}`;
  if(enabled&&pageRange)state.librarySelectionExtraPageRanges[key]=String(pageRange);
  if(!enabled)delete state.librarySelectionExtraPageRanges[key];
}
function purgeStaleExtraSelections(){
  const live=new Set(activeCatalog().map(item=>item.relativePath));
  state.librarySelectionExtras=state.librarySelectionExtras||{};
  state.librarySelectionExtraPageRanges=state.librarySelectionExtraPageRanges||{};
  for(const section of PLANNING_LIBRARY_KEYS){
    const primary=String(state.librarySelections?.[section]||'');
    const kept=extraSelectionPaths(section).filter(path=>live.has(path)&&path!==primary);
    state.librarySelectionExtras[section]=kept;
  }
  for(const key of Object.keys(state.librarySelectionExtraPageRanges)){
    const split=key.indexOf('::');
    const path=split>=0?key.slice(split+2):'';
    if(path&&!live.has(path))delete state.librarySelectionExtraPageRanges[key];
  }
}
function enrichManifestWithExtraVersions(manifest){
  if(!manifest?.entries)return manifest;
  const entries=[];
  for(const entry of manifest.entries){
    entries.push(entry);
    if(!PLANNING_LIBRARY_KEYS.includes(entry.key)||entry.additionalVersion)continue;
    for(const path of extraSelectionPaths(entry.key)){
      if(path===entry.selectedPath)continue;
      const candidate=findCatalogCandidate(path);
      if(!candidate?.file)continue;
      entries.push({...entry,candidates:[candidate],selectedPath:path,selectedFile:candidate.file,selectedCandidate:candidate,autoSelectedUnique:false,pageRange:extraSelectionPageRange(entry.key,path),requiresPageRange:false,status:'matched',additionalVersion:true,additionalVersionOf:entry.key});
    }
  }
  return {...manifest,entries};
}

function clearPlanningLibrarySelection(key){
  delete state.librarySelections[key];
  delete state.librarySelectionTitles[key];
  delete state.libraryPageRanges[key];
  if(state.librarySelectionExtras)delete state.librarySelectionExtras[key];
  if(state.librarySelectionExtraPageRanges){for(const extraKey of Object.keys(state.librarySelectionExtraPageRanges))if(extraKey.startsWith(`${key}::`))delete state.librarySelectionExtraPageRanges[extraKey];}

function synchronizePlanningLibrarySelections(){
  const resolver=window.ScoreBankLibraryMatchResolver;
  state.librarySelectionTitles=state.librarySelectionTitles||{};
  for(const key of PLANNING_LIBRARY_KEYS){
    const title=String(state.index?.[key]||'').trim();
    const selectedPath=String(state.librarySelections?.[key]||'');
    if(!title){if(selectedPath)clearPlanningLibrarySelection(key);continue;}
    if(!selectedPath)continue;
    const remembered=String(state.librarySelectionTitles?.[key]||'').trim();
    if(remembered&&resolver?.normalizeText?.(remembered)!==resolver?.normalizeText?.(title)){
      clearPlanningLibrarySelection(key);continue;
    }
    const candidate=findCatalogCandidate(selectedPath);
    if(!candidate)continue;
    const score=resolver?.scoreCandidate?.(planningMatchTitle(title),candidate,{sectionKey:key,language:state.language})?.score??0;
    // Legacy builds did not remember the title that belonged to a selected PDF.
    // Reject clearly unrelated carry-over files (for example Rain Down paired with
    // an old A Thousand Years PDF) but preserve plausible/manual matches.
    if(!remembered&&score<0.45){clearPlanningLibrarySelection(key);continue;}
    state.librarySelectionTitles[key]=title;
  }
}

  if(!book?.sections)return book;
  return {...book,sections:book.sections.map(section=>PLANNING_LIBRARY_KEYS.includes(section.key)?{...section,matchQuery:planningMatchTitle(section.title)}:section)};

function removeForeignMassSettingBleed(manifest){
  if(!manifest?.entries)return manifest;
  const resolver=window.ScoreBankLibraryMatchResolver;
  const massPaths=new Set((state.massFolderCatalog||[]).map(item=>String(item.relativePath||'')));
  for(const item of state.libraryCatalog||[]){
    if(resolver?.inferLibraryRole?.(item.relativePath)===resolver?.LIBRARY_ROLES?.MASS_SETTING)massPaths.add(String(item.relativePath||''));
  }
  const entries=manifest.entries.map(entry=>{
    if(MASS_PART_KEYS.includes(entry.key)||!entry.selectedPath)return entry;
    if(!massPaths.has(String(entry.selectedPath||'')))return entry;
    return {...entry,selectedPath:'',selectedFile:null,selectedCandidate:null,status:'missing',foreignMassSettingBlocked:true};
  });
  return {...manifest,entries};
}

function connectedMassPartCandidates(setting,part){
  if(!setting)return [];
  const resolver=window.ScoreBankLibraryMatchResolver;
  const combined=[...(state.massFolderCatalog||[]),...(state.libraryCatalog||[]).filter(item=>resolver?.inferLibraryRole?.(item.relativePath)===resolver?.LIBRARY_ROLES?.MASS_SETTING)];
  const seen=new Set();
  const rows=[];
  for(const item of combined){
    const path=String(item?.relativePath||'');
    if(!path||seen.has(path)||!settingPathMatches(setting,path)||!massPartPathMatches(part,path))continue;
    seen.add(path);rows.push(item);
  }
  const otherPartPenalty=item=>{
    const filename=normalizeProfileText(item?.filename||'');
    let count=0;
    for(const [key,aliases] of Object.entries(MASS_PART_ALIASES)){
      if(key===part)continue;
      if((aliases||[]).map(normalizeProfileText).some(alias=>alias&&(filename===alias||filename.includes(alias))))count+=1;
    }
    return count;
  };
  const compiledPenalty=item=>/\b(full|complete|compiled|setting|parts?|keyboard choir|accompaniment)\b/.test(normalizeProfileText(item?.filename||''))?1:0;
  const priority=item=>{
    const text=normalizeProfileText(`${item?.filename||''} ${item?.relativePath||''}`);
    // A dedicated Lead Sheet is normally one liturgical part; a large piano score
    // is more likely to contain adjacent movements (for example Kyrie + Gloria).
    if(/\blead sheet\b|\blead\b/.test(text))return 0;
    if(/\bpiano\b|\bkeyboard\b|\bkbd\b/.test(text))return 1;
    if(/\bchoir\b|\bsatb\b|\bcoro\b/.test(text))return 2;
    if(/\binstrumental\b|\binstrument\b/.test(text))return 3;
    return 4;
  };
  return rows.sort((a,b)=>otherPartPenalty(a)-otherPartPenalty(b)||compiledPenalty(a)-compiledPenalty(b)||priority(a)-priority(b)||String(a.relativePath||'').localeCompare(String(b.relativePath||'')));

function memorialFormulaKey(candidate){
  const text=String(`${candidate?.relativePath||''} ${candidate?.filename||''}`).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,' ');
  const formula1=/(?:memorial\s+)?acclamation[\s._-]*(?:a|1|i)\b|aclamacion[\s._-]*(?:a|1|i)\b/;
  const formula2=/(?:memorial\s+)?acclamation[\s._-]*(?:b|2|ii)\b|aclamacion[\s._-]*(?:b|2|ii)\b/;
  const formula3=/(?:memorial\s+)?acclamation[\s._-]*(?:c|3|iii)\b|aclamacion[\s._-]*(?:c|3|iii)\b/;
  if(/we\s+proclaim|proclaim\s+your\s+death|anunciamos\s+tu\s+muerte/.test(text)||formula1.test(text))return 'proclaim';

function memorialFormulaLabel(key,e){

function memorialChoiceMarkup(entry,e,selected,selectedCandidate,labels){
  const ordered=['proclaim','eat','save'];

  for(const candidate of entry.candidates||[])groups[memorialFormulaKey(candidate)].push(candidate);
  const selectedKey=selectedCandidate?memorialFormulaKey(selectedCandidate):'';

function additionalVersionsMarkup(entry,e,selected,visibleCandidates){
  if(!PLANNING_LIBRARY_KEYS.includes(entry?.key)||!selected)return '';

function bindLibraryWorkspace(){
