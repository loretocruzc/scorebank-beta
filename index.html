  const ROMAN_ORDINALS = [
    '',
    'I',
    'II',
    'III',
    'IV',
    'V',
    'VI',

  function utcDate(year, month, day) {
    // Noon UTC avoids daylight-saving transitions when dates are formatted locally.
    return new Date(Date.UTC(year, month, day, 12));
  }

  function addDays(date, days) {
    return new Date(date.getTime() + days * DAY_MS);
  }

  function daysBetween(start, end) {
    return Math.round((end.getTime() - start.getTime()) / DAY_MS);
  }

  function sameDate(left, right) {
    return left.getTime() === right.getTime();
  }

  function nextSunday(date, includeCurrent = true) {
    const offset = (7 - date.getUTCDay()) % 7;
    return addDays(date, offset === 0 && !includeCurrent ? 7 : offset);
  }

  function parseIsoDate(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!match) return null;

    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const date = utcDate(year, month - 1, day);

    if (
      date.getUTCFullYear() !== year ||
      date.getUTCMonth() !== month - 1 ||
      date.getUTCDate() !== day
    ) {
      return null;
    }

    return date;
  }

  // Gregorian computus, returned as a stable noon-UTC civil date.
  function easterSunday(year) {
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;

    return utcDate(year, month - 1, day);
  }

  function firstSundayOfAdvent(year) {
    return nextSunday(utcDate(year, 10, 27));
  }

  function cycleForDate(date) {
    const civilYear = date.getUTCFullYear();
    const liturgicalYear =
      date >= firstSundayOfAdvent(civilYear) ? civilYear + 1 : civilYear;

    if (christmas.getUTCDay() === 0) {

    }

    return nextSunday(christmas, false);

  function localize(language, spanish, english) {

  function unsupported(dateString, date, language) {

      date: dateString,
      language,

        isSunday

          : 'The selected date is not yet supported'

    language,
    celebration,
    season,
    color,

    return {
      id: `SB-CEL-${cycle}-${dateString}`,
      date: dateString,
      language,
      cycle,
      celebration,
      season,
      color,
      gloria,
      meditation,

    const easter = easterSunday(year);

    const palmSunday = addDays(easter, -7);
    const holyThursday = addDays(easter, -3);
    const goodFriday = addDays(easter, -2);
    const holySaturday = addDays(easter, -1);
    const pentecost = addDays(easter, 49);
    const advent = firstSundayOfAdvent(year);
    const christTheKing = addDays(advent, -7);
    const christmas = utcDate(year, 11, 25);
    const epiphanyDate = epiphany(year);
    const baptism = baptismOfTheLord(year);
    const holyFamilyDate = holyFamily(year);

    const base = {
      dateString,
      date,
      language

    // Fixed and transferred Christmas-season celebrations.
    if (sameDate(date, christmas)) {
      return identified({
        ...base,
        celebration: localize(
          language,
          'Natividad del Señor (Navidad)',
          'The Nativity of the Lord (Christmas)'
        ),
        season: localize(language, 'Navidad', 'Christmas'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    if (sameDate(date, holyFamilyDate)) {
      return identified({
        ...base,
        celebration: localize(
          language,
          'La Sagrada Familia de Jesús, María y José',
          'The Holy Family of Jesus, Mary and Joseph'
        ),
        season: localize(language, 'Navidad', 'Christmas'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    if (sameDate(date, epiphanyDate)) {
      return identified({
        ...base,
        celebration: localize(
          language,
          'Epifanía del Señor',
          'The Epiphany of the Lord'
        ),
        season: localize(language, 'Navidad', 'Christmas'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    if (sameDate(date, baptism)) {
      return identified({
        ...base,
        celebration: localize(
          language,
          'Bautismo del Señor',
          'The Baptism of the Lord'
        ),
        season: localize(language, 'Navidad', 'Christmas'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    // Principal movable celebrations based on Easter.
    if (sameDate(date, ashWednesday)) {
      return identified({
        ...base,
        celebration: localize(language, 'Miércoles de Ceniza', 'Ash Wednesday'),
        season: localize(language, 'Cuaresma', 'Lent'),
        color: localize(language, 'Morado', 'Violet'),
        gloria: false,
        meditation: false
      });

        ...base,
        celebration: localize(
          language,
          'Domingo de Ramos de la Pasión del Señor',
          'Palm Sunday of the Passion of the Lord'
        ),
        season: localize(language, 'Cuaresma', 'Lent'),
        color: localize(language, 'Rojo', 'Red'),
        gloria: false,
        meditation: false
      });

        ...base,
        celebration: localize(
          language,
          'Jueves Santo de la Cena del Señor',
          "Holy Thursday of the Lord's Supper"

        season: localize(language, 'Triduo Pascual', 'Triduum'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: false
      });

        ...base,
        celebration: localize(
          language,
          'Viernes de la Pasión del Señor (Viernes Santo)',
          'Friday of the Passion of the Lord (Good Friday)'
        ),
        season: localize(language, 'Triduo Pascual', 'Triduum'),
        color: localize(language, 'Rojo', 'Red'),
        gloria: false,
        meditation: false
      });
    }

    if (sameDate(date, holySaturday)) {
      return identified({
        ...base,
        celebration: localize(language, 'Sábado Santo', 'Holy Saturday'),
        season: localize(language, 'Triduo Pascual', 'Triduum'),
        color: localize(language, 'Morado', 'Violet'),
        gloria: false,
        meditation: false
      });
    }

    if (sameDate(date, easter)) {
      return identified({
        ...base,
        celebration: localize(
          language,
          'Domingo de Pascua de la Resurrección del Señor',
          'Easter Sunday of the Resurrection of the Lord'
        ),
        season: localize(language, 'Pascua', 'Easter'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    if (sameDate(date, pentecost)) {
      return identified({
        ...base,
        celebration: localize(
          language,
          'Domingo de Pentecostés',
          'Pentecost Sunday'
        ),
        season: localize(language, 'Pascua', 'Easter'),
        color: localize(language, 'Rojo', 'Red'),
        gloria: true,
        meditation: true
      });
    }

    if (sameDate(date, christTheKing)) {
      return identified({
        ...base,
        celebration: localize(
          language,
          'Nuestro Señor Jesucristo, Rey del Universo',
          'Our Lord Jesus Christ, King of the Universe'
        ),
        season: localize(language, 'Tiempo Ordinario', 'Ordinary Time'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    // Fixed solemnities must be resolved before the generic Sunday calculation.
    // In particular, All Saints on November 1 replaces an Ordinary Time Sunday
    // when the dates coincide (as on November 1, 2026).
    const allSaints = utcDate(year, 10, 1);
    if (sameDate(date, allSaints)) {
      return identified({
        ...base,
        celebration: localize(language, 'Todos los Santos', 'All Saints'),
        season: localize(language, 'Tiempo Ordinario', 'Ordinary Time'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    // The remaining implemented calendar is Sunday-based.
    if (date.getUTCDay() !== 0) {
      return unsupported(dateString, date, language);
    }

    if (date >= advent && date < christmas) {
      const number = Math.floor(daysBetween(advent, date) / 7) + 1;
      if (number >= 1 && number <= 4) {
        return identified({
          ...base,
          celebration: seasonalSundayName(
            number,
            'Adviento',
            'Advent',
            language
          ),
          season: localize(language, 'Adviento', 'Advent'),
          color: localize(language, 'Morado', 'Violet'),
          gloria: false,
          meditation: false
        });
      }
    }

    const firstSundayOfLent = nextSunday(addDays(ashWednesday, 1));
    if (date >= firstSundayOfLent && date < palmSunday) {
      const number = Math.floor(daysBetween(firstSundayOfLent, date) / 7) + 1;
      return identified({
        ...base,
        celebration: seasonalSundayName(
          number,
          'Cuaresma',
          'Lent',
          language
        ),
        season: localize(language, 'Cuaresma', 'Lent'),
        color: localize(language, 'Morado', 'Violet'),
        gloria: false,
        meditation: false
      });
    }

    if (date > easter && date < pentecost) {
      const number = Math.floor(daysBetween(easter, date) / 7) + 1;
      return identified({
        ...base,
        celebration: seasonalSundayName(number, 'Pascua', 'Easter', language),
        season: localize(language, 'Pascua', 'Easter'),
        color: localize(language, 'Blanco', 'White'),
        gloria: true,
        meditation: true
      });
    }

    if (date > baptism && date < ashWednesday) {
      const number = Math.floor(daysBetween(baptism, date) / 7) + 1;
      if (number >= 2 && number <= 8) {
        return identified({
          ...base,
          celebration: ordinarySundayName(number, language),
          season: localize(language, 'Tiempo Ordinario', 'Ordinary Time'),
          color: localize(language, 'Verde', 'Green'),
          gloria: true,
          meditation: true

        Math.floor(daysBetween(date, christTheKing) / 7);
      const number = 34 - weeksBeforeChristTheKing;

      const isUnimplementedSolemnity =
        sameDate(date, addDays(pentecost, 7)) ||
        sameDate(date, addDays(pentecost, 14));

      if (!isUnimplementedSolemnity && number >= 1 && number <= 33) {
        return identified({
          ...base,
          celebration: ordinarySundayName(number, language),
          season: localize(language, 'Tiempo Ordinario', 'Ordinary Time'),
          color: localize(language, 'Verde', 'Green'),
          gloria: true,
          meditation: true
        });
      }
    }

    return unsupported(dateString, date, language);
  }

  function groupItemsIntoLines(items, yTolerance = 3) {
    const rows = [];

      const str = String(item?.str || '').replace(/\s+/g, ' ').trim();
      if (!str) continue;
      const t = Array.isArray(item?.transform) ? item.transform : [];
      const x = Number(t[4] || 0);
      const y = Number(t[5] || 0);
      let row = rows.find(r => Math.abs(r.y - y) <= yTolerance);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ str, x, width: Number(item?.width || 0) });
    }
    rows.sort((a,b) => b.y - a.y);
    return rows.map(row => {
      row.items.sort((a,b) => a.x - b.x);
      return { y: row.y, text: row.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim(), items: row.items };
    }).filter(r => r.text);

  function rowAwareColumnContinuationLinesFromItems(items, pageWidth = 612) {
    const rows = groupItemsIntoLines(items);
    if (!rows.length) return [];
    const width = Number(pageWidth || 612);
    const midpoint = width / 2;
    const left = [], right = [], spanning = [];

    // Classify complete text rows instead of individual PDF items. A long TLP
    // heading such as “PRESENTATION AND PREPARATION OF THE GIFTS” can begin in
    // the left column and cross the mathematical midpoint by only a few points.
    // Treating that single item as a full-width span moves the heading away from
    // the songs that continue at the top of the right column and truncates the
    // section (the real 9/13/2026 page was reduced to two Offertory choices).
    for (const row of rows) {
      const minX = Math.min(...row.items.map(item => Number(item.x || 0)));
      const maxX = Math.max(...row.items.map(item => Number(item.x || 0) + Number(item.width || 0)));

      const hasRightItem = row.items.some(item => Number(item.x || 0) > midpoint + 28);

      left.length ? left[0].y : -Infinity,
      right.length ? right[0].y : -Infinity

      ...left.map(row => row.text),
      ...right.map(row => row.text),

  function sourceOrderedLinesFromItems(items) {
    const list = Array.from(items || []).filter(item => String(item?.str || '').trim());

    let current = '';
    let currentY = null;
    const flush = () => {
      const value = current.replace(/\s+/g, ' ').trim();
      if (value) lines.push(value);
      current = '';
      currentY = null;
    };
    for (const item of list) {
      const text = String(item?.str || '').replace(/\s+/g, ' ').trim();
      if (!text) continue;
      const t = Array.isArray(item?.transform) ? item.transform : [];
      const y = Number(t[5]);
      const hasY = Number.isFinite(y);

      // This is important for TLP pages whose internal text order is semantically
      // correct even when spanning headings and columns have misleading coordinates.
      if (current && hasY && currentY != null && Math.abs(y - currentY) > 2.5) flush();

      if (item?.hasEOL) flush();

  function pageLineVariantsFromItems(items, pageWidth = 612) {
    const list = Array.from(items || []).filter(item => String(item?.str || '').trim());
    if (!list.length) return [[]];
    const width = Number(pageWidth || 612);
    const midpoint = width / 2;
    const left = [], right = [], spanning = [];
    for (const item of list) {
      const t = Array.isArray(item?.transform) ? item.transform : [];
      const x = Number(t[4] || 0);
      const w = Number(item?.width || 0);
      const center = x + w / 2;
      const crossesMiddle = x < midpoint && x + w > midpoint;
      if (crossesMiddle || w >= width * 0.56) spanning.push(item);
      else if (center < midpoint) left.push(item);
      else right.push(item);

    const naturalRows = groupItemsIntoLines(list);
    const leftRows = groupItemsIntoLines(left);
    const rightRows = groupItemsIntoLines(right);
    const spanRows = groupItemsIntoLines(spanning);

    const twoColumn = leftRows.length >= 3 && rightRows.length >= 3;
    if (!twoColumn) return [natural];

      leftRows.length ? leftRows[0].y : -Infinity,
      rightRows.length ? rightRows[0].y : -Infinity

    const lowerSpanning = spanRows.filter(r => !topSpanning.includes(r));

      ...topSpanning.map(r => r.text),
      ...leftRows.map(r => r.text),
      ...rightRows.map(r => r.text),
      ...lowerSpanning.map(r => r.text)

    // Real TLP recommendation pages can contain a full-width section heading in
    // the lower half of a page (notably “SONG OF PRAISE OR SENDING FORTH”) while
    // the song rows beneath it live in one visual column.  A single flattened
    // column order can therefore move that heading *after* its songs.  Keep both
    // the column-safe stream and the true top-to-bottom stream; the parser later
    // evaluates both and keeps the strongest result for each liturgical moment.
    // Keep a third variant in the PDF's own content-stream order. PDF text
    // extractors frequently preserve TLP's semantic section sequence there even
    // when visual coordinate sorting interleaves two columns. This is a fallback,
    // not the primary layout, and the parser still selects the best list per moment.
    const sourceOrdered = sourceOrderedLinesFromItems(list);

      if (!key || seen.has(key)) continue;
      seen.add(key);
      unique.push(variant);
    }

  function columnOrderedLinesFromItems(items, pageWidth = 612) {
    return pageLineVariantsFromItems(items, pageWidth)[0] || [];
  }

  async function extractPagesWithLines(file, dependencies = {}) {
    const locator = global.ScoreBankPdfPageLocator;
    if (!locator?.loadPdfJs) throw new Error('PDF reader is unavailable.');
    const pdfjs = await locator.loadPdfJs(dependencies);
    const bytes = await file.arrayBuffer();
    const task = pdfjs.getDocument({ data: new Uint8Array(bytes), isEvalSupported: false, useSystemFonts: true });
    const doc = await task.promise;

          lines = [];

            const str = String(item?.str || '').trim();

            if (item?.hasEOL && current) { lines.push(current.replace(/\s+/g,' ').trim()); current=''; }

          if (current) lines.push(current.replace(/\s+/g,' ').trim());
          lineVariants = [lines];
        }
        const text = lines.join(' ');
        pages.push({ pageNumber, lines, lineVariants, text });
        page.cleanup?.();
      }

      await doc.destroy?.();
    }
    return pages;
  }

  function structuralAliasMatches(normalizedLine, alias) {

    // append explanatory text after the heading.

    // treated as the Entrance song-planning section simply because it starts with
    // the word "Entrance". The same problem affected Communion Antiphon.
    if (STOP_SECTION_ALIASES.some(aliasMatchesHeading)) return '__stop__';

    'PREPARATION AND PRESENTATION OF THE GIFTS',
    'SONG OF PRAISE OR SENDING FORTH',
    'SONG OF PRAISE / SENDING FORTH',
    'THE CONCLUDING RITES',
    'CONCLUDING RITES',
    'MUSIC SUGGESTIONS',
    'SELECCIÓN MUSICAL',
    'SELECCION MUSICAL',
    'CANTO DE ENTRADA',
    'CANTO DE ENTRADA Y PROCESIÓN',
    'CANTO DE ENTRADA Y PROCESION',
    'ENTRADA Y PROCESIÓN',
    'ENTRADA Y PROCESION',
    'ENTRADA',
    'PREPARACIÓN DE LAS OFRENDAS',
    'PREPARACION DE LAS OFRENDAS',
    'PREPARACIÓN DE OFRENDAS',
    'PREPARACION DE OFRENDAS',
    'CANTO DE OFRENDAS',
    'OFRENDAS',
    'OFERTORIO',
    'CANTO DE COMUNIÓN',
    'CANTO DE COMUNION',
    'CANTO DE SALIDA',
    'CANTO FINAL',
    'CANTO DE ENVÍO',

    if (family === 'tlp' && /\[(?:BB(?:\/MI)?(?:\/TP)?|MI(?:\/TP)?|TP|CP\d?|GP\d?|H|J\d?|NTY|R\d?|S&S|SS\d?|UC|VOZ|OCP)\s+\d/i.test(raw)) return true;

    if (words.length < 2 || words.length > 10) return false;
    if (/[.!?;:]$/.test(raw)) return false;
    if (/^(to|and|but|for|with|from|that|this|he|she|they|we|it|who|which|when|because)\b/i.test(raw)) return false;
    return titleCaseEvidence(raw) >= 0.72;
  }

  function sourceSpecificSongLineAllowed(value, context = {}) {
    const family = String(context.sourceFamily || '').toLowerCase();
    if (isScriptureOrEditorialProse(value)) return false;
    if (family === 'tlp') {
      // PDF text extraction sometimes splits a TLP recommendation into two lines:
      // the song title on one line and the hymnal/catalog references on the next.
      // Requiring catalog numbers on the title line discarded valid suggestions.
      // Accept either a catalogued row OR a short, title-like repertoire line.
      if (!likelyPlannerSongTitle(value)) return false;
    }
    return true;
  }

  function isPlannerMastheadOrUtilityLine(value) {
    const raw = String(value || '').replace(/\s+/g, ' ').trim();
    const n = normalize(raw);
    if (!raw) return false;
    if (/^(?:year\s+[abc]\s+)?20\d{2}\s+today s liturgy(?:\s+\d+)?$/.test(n)) return true;
    if (/^today s liturgy(?:\s+year\s+[abc]\s+20\d{2})?(?:\s+\d+)?$/.test(n)) return true;
    // PDF extraction can also place the printed page number before the masthead,
    // e.g. `130 TODAY'S LITURGY Year A 2026`. It is never a song title.
    if (/^\d{1,4}\s+today s liturgy(?:\s+year\s+[abc]\s+20\d{2})?$/.test(n)) return true;
    if (/^music suggestions$/.test(n)) return true;
    if (/^see page \d+ for an abbreviation key$/.test(n)) return true;
    if (/^for additional music suggestions\b/.test(n)) return true;
    if (/^visit liturgy com\b/.test(n) || /^ocp org\b/.test(n)) return true;
    return false;
  }

  function cleanSongLine(line, context = {}) {
    let value = String(line || '').replace(/\s+/g,' ').trim();
    if (isPlannerMastheadOrUtilityLine(value)) return '';
    if (isPlannerEditorialColumnFragment(value, context)) return '';
    // Strip only real bullets / numbered-list markers. Never strip bare leading digits,
    // because repertoire titles can legitimately begin with a number (e.g.
    // `10,000 Reasons` or `40 Days and 40 Nights`).
    value = value.replace(/^(?:[-•·\u2022]+\s*|\d{1,3}[.)]\s+)/, '').trim();
    value = value.replace(/\s+\.{2,}\s*\d+\s*$/, '').trim();
    // A trailing number can be a PDF/page artifact on plain prose, but on a planner
    // row it is often the final hymnal/catalog reference (for example CP3 397).
    // Never strip that final reference number when catalog evidence is present.
    if (!hasPlannerCatalogEvidence(value)) value = value.replace(/\s+\d{1,4}\s*$/, '').trim();
    if (value.length < 3) return '';
    // TLP/LCP rows can be long because the publication appends many hymnal/catalog
    // references to one song title. Do not mistake those catalogue-rich rows for
    // editorial prose merely because the extracted line is long.
    const catalogRichPlannerRow = ['tlp','lcp'].includes(String(context.sourceFamily || '').toLowerCase()) && hasPlannerCatalogEvidence(value);
    if (value.length > (catalogRichPlannerRow ? 280 : 110)) return '';
    const n = normalize(value);
    if (PASS_THROUGH_SUBHEADINGS.some(alias => n === normalize(alias) || n.startsWith(normalize(alias) + ' '))) return '';
    if (/^(entrance|opening|gathering|entrada|offertory|ofertorio|communion|comunion|sending forth|recessional|salida)$/.test(n)) return '';
    if (STOP_SECTION_ALIASES.some(alias => structuralAliasMatches(n, alias))) return '';
    if (['liturgia','liturgy','rito','rite','homilia','homily','gloria','holy','santo','amen','cordero','lamb of god'].includes(n)) return '';
    if (/^(readings|lecturas|responsorial psalm|salmo responsorial|gospel acclamation|aclamacion del evangelio|aclamacion antes del evangelio)/.test(n)) return '';
    // Reject catalog-number fragments that have no real title text.
    const strippedCatalog = value.replace(/\b[A-Z]{1,8}\d?(?:\/[A-Z]{1,8}\d?)?\s+#?\d{1,8}[A-Za-z*]?\b/g,' ').replace(/\be\s*\d+\b/gi,' ').replace(/[0-9*().,-]+/g,' ').replace(/\s+/g,' ').trim();
    if (strippedCatalog.split(/\s+/).filter(w=>/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(w)).length < 2) return '';
    if (!languageLikelyMatches(value, context.language)) return '';
    if (seasonalMismatch(value, context)) return '';
    if (!sourceSpecificSongLineAllowed(value, context)) return '';
    return value;
  }

  function parseSuggestionsFromPages(pages, anchorIndex, context = {}) {
    const moments = { entrance: [], gifts: [], communion: [], sending: [] };
    const seen = Object.fromEntries(Object.keys(moments).map(k => [k, new Set()]));
    let currentSection = null;
    let lastSongSection = null;
    let lastSongIndex = -1;
    const start = Math.max(0, anchorIndex);
    // TLP weekly planning blocks can flow across more than one facing page.
    // Read forward far enough to capture all four moments, but always stop at the
    // next celebration heading below.
    const end = Math.min(pages.length - 1, anchorIndex + 6);
    let passedAnchor = context.anchorLineIndex == null;
    for (let i=start; i<=end; i++) {
      const lines = pages[i].lines || [];
      const firstLine = i === start ? Math.max(0, Number(context.anchorLineIndex ?? 0)) : 0;
      for (let lineIndex=firstLine; lineIndex<lines.length; lineIndex++) {
        const line = lines[lineIndex];
        if (!passedAnchor) { passedAnchor = true; continue; } // skip the celebration heading itself
        // Once the requested block has started, another celebration heading closes it.
        if (context.celebration && likelyCelebrationHeading(line) && !sameCelebrationHeading(line, context)) return moments;
        const physicalFragments = splitPlannerPhysicalLine(line, context);
        for (const subline of physicalFragments) {
          const normalizedLine = normalize(subline);
          // A TLP planner/readings page can contain blank labels for all four moments,
          // immediately followed by the real MUSIC SUGGESTIONS page. Reset here so the
          // blank planner's Sending Forth label never captures the following page.
          if (normalizedLine === 'music suggestions' || normalizedLine.startsWith('music suggestions ') ||
              normalizedLine === 'seleccion musical' || normalizedLine.startsWith('seleccion musical ')) {
            currentSection = null;
            continue;
          }
          const detected = sectionForLine(subline);
          if (detected) {
            // Sending Forth is normally final, but a visually flattened two-column
            // stream may surface another *real planning moment* afterward. In that
            // case switch sections; preserve Sending only through non-song stop labels.
            if (currentSection === 'sending') {
              if (detected !== '__stop__') {
                currentSection = detected;
              } else if (/^choral(?: suggestions)?$/.test(normalizedLine)) {
                currentSection = null;
              }
              continue;
            }
            currentSection = detected === '__stop__' ? null : detected;
            continue;
          }
          if (!currentSection) continue;
          const fragment = plannerSuggestionFragment(subline, context);
          if (fragment.kind === 'refs') {
            // PDF extraction often puts the title on one line and the remaining
            // TLP/LCP hymnal references on the next line. Append those references
            // to the preceding song instead of exposing them as a second choice.
            let targetSection = currentSection;
            let list = moments[targetSection] || [];
            let lastIndex = list.length - 1;
            // A flattened TLP row can place the next section heading before the
            // final catalogue references of the previous song. If the active
            // section has not produced the most recent song, attach the refs to
            // that globally most recent repertoire row instead of losing them.
            if (lastSongSection && (lastSongSection !== currentSection || lastIndex < 0)) {
              targetSection = lastSongSection;
              list = moments[targetSection] || [];
              lastIndex = lastSongIndex >= 0 ? lastSongIndex : list.length - 1;
            }
            if (lastIndex >= 0 && list[lastIndex]) {
              const prior = String(list[lastIndex] || '').trim();
              const refs = String(fragment.text || '').trim();
              if (refs && !normalize(prior).endsWith(normalize(refs))) {
                list[lastIndex] = `${prior} ${refs}`.replace(/\s+/g,' ').trim();
              }
            }
            continue;
          }
          if (fragment.kind !== 'song') continue;
          const title = fragment.text;
          const key = normalize(title);
          if (!key || seen[currentSection].has(key)) continue;
          // Reject obvious prose / headings.
          const words = title.split(/\s+/);
          // A real TLP/LCP song line may exceed 14 tokens only because the title is
          // followed by A/BB/MI/CP/GP/H/J/OCP catalogue references. Preserve those
          // rows; the stricter prose/language/source checks already ran above.
          const catalogRichPlannerRow = ['tlp','lcp'].includes(String(context.sourceFamily || '').toLowerCase()) && hasPlannerCatalogEvidence(title);
          if (words.length > 14 && !catalogRichPlannerRow) continue;
          seen[currentSection].add(key);
          moments[currentSection].push(title);
          lastSongSection = currentSection;
          lastSongIndex = moments[currentSection].length - 1;
        }
      }
    }
    return moments;
  }

  function plannerMomentVariantScore(rows = []) {
    const safe = Array.from(rows || []).filter(Boolean);
    let score = safe.length * 1000;
    for (const row of safe) {
      const text = String(row || '').trim();
      score += plannerCatalogMatches(text).length * 8;
      if (/\([^)]+\)/.test(text)) score += 2;
      if (isPlannerEditorialColumnFragment(text, { sourceFamily: 'tlp' })) score -= 500;
      if (/\[[^\]]*$|\]\s*;|\bcomposed texts?\b|\bof the beatitudes\b/i.test(text)) score -= 250;
    }
    return score;
  }

  function mergeMomentVariants(variants = []) {
    const merged = { entrance: [], gifts: [], communion: [], sending: [] };
    for (const moment of Object.keys(merged)) {
      let best = [];
      let bestScore = -Infinity;
      for (const candidate of Array.from(variants || [])) {
        const rows = Array.isArray(candidate?.[moment]) ? candidate[moment] : [];
        const score = plannerMomentVariantScore(rows);
        // More valid songs remains the primary signal. When two extraction orders
        // recover the same number of songs, prefer the one with more complete
        // printed catalogue references and less editorial contamination.
        if (score > bestScore) {
          best = rows;
          bestScore = score;
        }
      }
      merged[moment] = Array.from(best);
    }

    // When PDF column flattening moves the lower Sending heading below its songs,
    // those same songs are often swallowed by the preceding Communion section in
    // one variant while another visual-order variant classifies them correctly as
    // Sending.  The correctly headed later section wins for those duplicated rows.
    // This is intentionally limited to Sending because that is the known TLP layout
    // failure; it avoids broadly deduplicating songs that a publisher may genuinely
    // recommend in more than one earlier liturgical moment.
    const sendingKeys = new Set(merged.sending.map(normalize));
    if (sendingKeys.size) {
      for (const moment of ['entrance','gifts','communion']) {
        merged[moment] = merged[moment].filter(title => !sendingKeys.has(normalize(title)));
      }
    }
    return merged;
  }


  function lcpMomentSetScore(moments = {}) {
    const keys = ['entrance','gifts','communion','sending'];
    const counts = keys.map(key => Array.isArray(moments?.[key]) ? moments[key].length : 0);
    const covered = counts.filter(Boolean).length;
    const total = counts.reduce((sum,value)=>sum+value,0);
    const maxCount = Math.max(0,...counts);
    const nonzero = counts.filter(Boolean).sort((a,b)=>a-b);
    const median = nonzero.length ? nonzero[Math.floor((nonzero.length-1)/2)] : 0;
    let score = covered * 5000 + Math.min(total, 36) * 80;
    // A real LCP SELECCIÓN MUSICAL block normally has several choices in each
    // named moment. A flattened column variant that swallows the next section can
    // produce 15–30 rows under one heading; strongly penalize that imbalance.
    if (maxCount > 12) score -= (maxCount - 12) * 1800;
    if (median && maxCount > median * 2.4) score -= Math.round((maxCount - median * 2.4) * 900);
    // Structural pseudo-titles are never repertoire. Their presence means this
    // PDF text order lost a section boundary and should not win merely by length.
    for (const key of keys) {
      for (const row of moments?.[key] || []) {
        const n = normalize(row);
        if (/^(aclamacion antes del evangelio|salmo responsorial|gospel acclamation|responsorial psalm)/.test(n)) score -= 5000;
      }
    }
    return score;
  }

  function lcpVariantIsPlausible(moments = {}) {
    const keys = ['entrance','gifts','communion','sending'];
    for (const key of keys) {
      const rows = Array.isArray(moments?.[key]) ? moments[key] : [];
      // A single LCP moment normally contains a compact recommendation list. A
      // 15–30 row section is almost always a flattened-column boundary failure.
      if (rows.length > 12) return false;
      for (const row of rows) {
        const n = normalize(row);
        if (/^(aclamacion antes del evangelio|salmo responsorial|gospel acclamation|responsorial psalm)/.test(n)) return false;
      }
    }
    return true;
  }

  function mergeLcpMomentVariants(variants = []) {
    const empty = { entrance: [], gifts: [], communion: [], sending: [] };
    const ranked = Array.from(variants || [])
      .map((moments,index)=>({ moments: moments || empty, index, score: lcpMomentSetScore(moments || empty) }))
      .sort((a,b)=>b.score-a.score || a.index-b.index);
    if (!ranked.length) return empty;

    // Build 096: LCP PDF text order can be correct for one liturgical moment and
    // wrong for another on the very same page.  Do not let cross-variant majority
    // voting erase a valid Entrance/Offertory list merely because two flattened
    // orders place those same rows under the following heading.  First choose the
    // strongest *section-local* reconstruction, then use other plausible orders
    // only to supplement missing rows.
    const plausible = ranked.filter(item => lcpVariantIsPlausible(item.moments));
    const pool = plausible.length ? plausible : [ranked[0]];
    const chosen = { entrance: [], gifts: [], communion: [], sending: [] };

    const assignmentVotes = new Map();
    for (const item of pool) {
      for (const key of Object.keys(empty)) {
        for (const row of item.moments?.[key] || []) {
          const id = normalize(row);
          if (!id) continue;
          if (!assignmentVotes.has(id)) assignmentVotes.set(id,new Map());
          const votes = assignmentVotes.get(id);
          votes.set(key,(votes.get(key)||0)+1);
        }
      }
    }

    for (const key of Object.keys(empty)) {
      const byMoment = pool
        .map(item => ({ item, rows: Array.from(item.moments?.[key] || []), score: plannerMomentVariantScore(item.moments?.[key] || []) }))
        .sort((a,b)=>b.score-a.score || b.rows.length-a.rows.length || a.item.index-b.item.index);
      const seen = new Set();
      const primary = byMoment[0];

      // The best local reconstruction is authoritative for this moment. This is
      // what restores lists such as Entrance and Preparation of the Gifts when a
      // different PDF order happens to classify their rows under Communion.
      for (const row of primary?.rows || []) {
        const id = normalize(row);
        if (!id || seen.has(id)) continue;
        seen.add(id);
        chosen[key].push(row);
        if (chosen[key].length >= 14) break;
      }

      // Supplement only when the row's cross-variant evidence supports this same
      // moment (or is tied).  This keeps the full publisher list without reviving
      // the old Build 093 bleed across Mass sections.
      for (const candidate of byMoment.slice(1)) {
        for (const row of candidate.rows) {
          const id = normalize(row);
          if (!id || seen.has(id)) continue;
          const votes = assignmentVotes.get(id);
          const own = votes?.get(key) || 0;
          const max = votes ? Math.max(...Array.from(votes.values())) : own;
          if (own < max) continue;
          seen.add(id);
          chosen[key].push(row);
          if (chosen[key].length >= 14) break;
        }
        if (chosen[key].length >= 14) break;
      }
    }

    // If the exact same extracted row was assigned to two moments, keep it in the
    // moment with stronger section-local support. Genuine publisher repeats are
    // still allowed when the title strings differ by their printed references.
    const bestMomentScore = {};
    for (const key of Object.keys(empty)) {
      bestMomentScore[key] = pool.reduce((best,item)=>Math.max(best,plannerMomentVariantScore(item.moments?.[key] || [])),-Infinity);
    }
    const owners = new Map();
    for (const key of Object.keys(empty)) {
      for (const row of chosen[key]) {
        const id = normalize(row);
        if (!owners.has(id)) owners.set(id,[]);
        owners.get(id).push(key);
      }
    }
    for (const [id,keys] of owners.entries()) {
      if (keys.length < 2) continue;
      const winner = keys.slice().sort((a,b)=>bestMomentScore[b]-bestMomentScore[a])[0];
      for (const key of keys) {
        if (key !== winner) chosen[key] = chosen[key].filter(row => normalize(row) !== id);
      }
    }
    return chosen;
  }

  function parseSuggestionsBeforeAnchor(pages, anchor, context = {}) {
    const empty = { entrance: [], gifts: [], communion: [], sending: [] };
    if (!anchor || !pages?.[anchor.pageIndex]) return empty;

    const candidates = [];
    const hasMusicSuggestions = lines => Array.from(lines || []).some(line => {
      const n = normalize(line);
      return n === 'music suggestions' || n.startsWith('music suggestions ') ||
        n === 'seleccion musical' || n.startsWith('seleccion musical ');
    });
    const parseCandidate = (page, lines) => {
      if (!page) return;
      const supplied = Array.from(lines || []);
      const variants = [];
      const seenVariants = new Set();
      const addVariant = value => {
        const safe = Array.from(value || []);
        if (!safe.length || !hasMusicSuggestions(safe)) return;
        const key = safe.join('\u241e');
        if (seenVariants.has(key)) return;
        seenVariants.add(key);
        variants.push(safe);
      };
      addVariant(supplied);
      for (const variant of Array.from(page.lineVariants || [])) addVariant(variant);
      if (!variants.length) return;

      // Evaluate every plausible PDF text order for the SAME physical page, then
      // keep the richest clean list independently for Entrance, Gifts, Communion
      // and Sending Forth. This is deliberately page-local, so it cannot borrow
      // recommendations from another Sunday.
      const perVariant = variants.map(safeLines => {
        const synthetic = [{ pageNumber: page.pageNumber, lines: safeLines, text: safeLines.join(' ') }];
        return parseSuggestionsFromPages(synthetic, 0, { ...context, celebration: '', anchorLineIndex: null });
      });
      // A real TLP page may need DIFFERENT PDF text orders for different moments.
      // Example: the column order correctly reconstructs Entrance/Gifts/Communion,
      // while the natural visual order is the only one that places the lower
      // full-width `SONG OF PRAISE OR SENDING FORTH` heading before its songs.
      // Do not choose one whole-page variant and discard the other. Merge the
      // richest clean list independently for each liturgical moment.
      const best = String(context.sourceFamily || '').toLowerCase() === 'lcp'
        ? mergeLcpMomentVariants(perVariant)
        : mergeMomentVariants(perVariant);
      candidates.push(best);
    };

    // Some TLP PDFs place the MUSIC SUGGESTIONS block earlier on the same physical
    // page than the celebration/planner heading. Preserve support for that layout.
    const anchorPage = pages[anchor.pageIndex];
    const beforeAnchor = Array.from(anchorPage.lines || []).slice(0, Math.max(0, Number(anchor.lineIndex || 0)));
    parseCandidate(anchorPage, beforeAnchor);

    // The printed 2026 TLP layout normally uses a two-page weekly spread: the even
    // page is MUSIC SUGGESTIONS and the immediately following odd page is the
    // planner/readings page headed by the celebration. The previous implementation
    // claimed to support this but only inspected the anchor page itself. Explicitly
    // read exactly one physical page backward so adjacent Sundays cannot leak in.
    if (anchor.pageIndex > 0) {
      const previousPage = pages[anchor.pageIndex - 1];
      parseCandidate(previousPage, previousPage?.lines || []);
    }

    if (!candidates.length) return empty;
    // Different PDF text orders/pages can reconstruct different moments correctly.
    // Keep the richest clean list independently for Entrance, Gifts, Communion and
    // Sending Forth instead of choosing one whole candidate and accidentally
    // discarding a longer Gifts list.
    return String(context.sourceFamily || '').toLowerCase() === 'lcp'
      ? mergeLcpMomentVariants(candidates)
      : mergeMomentVariants(candidates);
  }

  function suggestionCoverage(moments = {}) {
    const keys = ['entrance','gifts','communion','sending'];
    const covered = keys.filter(key => Array.isArray(moments[key]) && moments[key].length).length;
    const total = keys.reduce((sum,key) => sum + (Array.isArray(moments[key]) ? moments[key].length : 0), 0);
    return { covered, total };
  }

  function normalizePsalmPlannerLine(value, language = 'es') {
    let raw = String(value || '').replace(/\s+/g, ' ').trim();
    if (!raw) return '';
    raw = raw.replace(/^[•·\-–—]+\s*/, '').trim();
    raw = raw.replace(/^R\.?\s*/i, '').replace(/^℟\.?\s*/i, '').trim();
    if (!raw) return '';
    const n = normalize(raw);
    if (/^(?:responsorial psalm|salmo responsorial|gospel acclamation|aclamacion del evangelio|second reading|segunda lectura|gospel|evangelio|communion antiphon|antifona de la comunion)\b/.test(n)) return '';
    if (isPlannerMastheadOrUtilityLine(raw) || likelyCelebrationHeading(raw)) return '';
    if (isPlannerEditorialColumnFragment(raw, { sourceFamily: language === 'en' ? 'tlp' : 'lcp' })) return '';
    return raw;
  }

  function extractPsalmSuggestionFromPages(pages, anchor, context = {}) {
    if (!anchor || !Array.isArray(pages)) return null;
    const language = String(context.language || 'es').toLowerCase().slice(0, 2) === 'en' ? 'en' : 'es';
    const headingRe = language === 'en' ? /^\s*Responsorial Psalm\b\s*[:\-–—]?\s*(.*)$/i : /^\s*Salmo Responsorial\b\s*[:\-–—]?\s*(.*)$/i;
    const stopRe = /^(?:Gospel Acclamation|Aclamaci[oó]n(?: del| antes del) Evangelio|Second Reading|Segunda Lectura|Gospel|Evangelio|Communion Antiphon|Ant[ií]fona de la Comuni[oó]n)\b/i;
    const startPage = Math.max(0, Number(anchor.pageIndex || 0) - 1);
    const endPage = Math.min(pages.length - 1, Number(anchor.pageIndex || 0) + 2);
    for (let pageIndex = startPage; pageIndex <= endPage; pageIndex++) {
      const page = pages[pageIndex] || {};
      const variants = Array.isArray(page.lineVariants) && page.lineVariants.length ? page.lineVariants : [page.lines || []];
      for (const variant of variants) {
        const lines = Array.from(variant || []);
        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
          const match = String(lines[lineIndex] || '').match(headingRe);
          if (!match) continue;
          const pieces = [];
          const tail = normalizePsalmPlannerLine(match[1], language);
          if (tail) pieces.push(tail);
          for (let j = lineIndex + 1; j < lines.length && pieces.length < 3; j++) {
            const raw = String(lines[j] || '').replace(/\s+/g, ' ').trim();
            if (!raw) continue;
            if (stopRe.test(raw) || sectionForLine(raw) || likelyCelebrationHeading(raw)) break;
            const cleaned = normalizePsalmPlannerLine(raw, language);
            if (!cleaned) continue;
            pieces.push(cleaned);
          }
          if (!pieces.length) continue;
          let reference = '';
          let response = '';
          const refIndex = pieces.findIndex(piece => /\b(?:ps(?:alm)?|salmo)\s*\d{1,3}\b/i.test(piece));
          if (refIndex >= 0) {
            const refPiece = pieces[refIndex];
            const colonIndex = refPiece.indexOf(':');
            if (colonIndex > 0 && /\b(?:ps(?:alm)?|salmo)\s*\d{1,3}\b/i.test(refPiece.slice(0, colonIndex))) {
              reference = refPiece.slice(0, colonIndex).trim();
              response = refPiece.slice(colonIndex + 1).trim();
            } else {
              reference = refPiece;
            }
          }
          if (!response) {
            const responseCandidate = pieces.find((piece, idx) => idx !== refIndex && !/^\s*(?:ps(?:alm)?|salmo)\s*\d/i.test(piece));
            if (responseCandidate) response = responseCandidate;
          }
          const title = [reference, response].filter(Boolean).join(': ') || pieces.join(' — ');
          if (!title) continue;
          return { title, page: Number(page.pageNumber || 0) || null };
        }
      }
    }
    return null;
  }

  function chooseBestMomentSet(primary, alternate) {
    const a = suggestionCoverage(primary);
    const b = suggestionCoverage(alternate);
    if (b.covered > a.covered) return alternate;
    if (b.covered === a.covered && b.total > a.total) return alternate;
    return primary;
  }

  function extractSourcePairPageHint(pages, anchor, context = {}) {
    if (!anchor || !Array.isArray(pages)) return null;
    const family = String(context.sourceFamily || '').toLowerCase();
    if (!['lcp','tlp'].includes(family)) return null;
    const start = Math.max(0, Number(anchor.pageIndex || 0) - 2);

  <script>
(function initializeLibraryMatchResolver(global) {
  'use strict';

  const SUPPORTED_EXTENSIONS = Object.freeze(['.pdf']);

    'pdf', 'score', 'sheet', 'music', 'musica', 'partitura', 'lead', 'full',
    'piano', 'guitar', 'guitarra', 'choir', 'coro', 'vocal', 'voice', 'voices',
    'instrumental', 'instruments', 'english', 'spanish', 'espanol', 'bilingual',
    'version', 'vers', 'arr', 'arrangement', 'arreglo', 'copy', 'copia'

  function stripDiacritics(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function normalizeText(value) {
    return stripDiacritics(value)
      .toLowerCase()
      .replace(/\.(pdf|musicxml|mxl|xml|mid|midi)$/gi, ' ')
      .replace(/[’'`]/g, '')
      .replace(/&/g, ' and ')
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function normalizeMassPartSegment(value) {
    return normalizeText(value)
      .replace(/^\d{1,3}\s+/, '')
      .replace(/^(?:part|parte)\s+\d{1,3}\s+/, '')
      .trim();

  function tokenize(value, options = {}) {

    return normalizeText(value)
      .split(' ')
      .filter(Boolean)

  }

  function titleFromFilename(filename) {
    return String(filename || '')
      .replace(/\.(pdf|musicxml|mxl|xml|mid|midi)$/i, '')
      .replace(/[_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function getExtension(filename) {
    const match = String(filename || '').toLowerCase().match(/(\.[a-z0-9]+)$/);
    return match ? match[1] : '';
  }

  function createBrowserCatalog(files) {
    return Array.from(files || [])
      .filter((file) => file && typeof file.name === 'string')
      .map((file, index) => {
        const relativePath = String(file.webkitRelativePath || file.relativePath || file.name);
        const extension = getExtension(file.name);
        return {
          id: `${relativePath}::${Number(file.size || 0)}::${Number(file.lastModified || 0)}::${index}`,
          filename: file.name,
          title: titleFromFilename(file.name),
          normalizedTitle: titleFromFilename(file.name),
          normalizedSearchTitle: normalizeText(titleFromFilename(file.name)),
          fileTypes: [extension.replace(/^\./, '')],
          relatedFiles: 1,
          source: 'browser-library',
          relativePath,
          relativeFolder: relativePath.includes('/') ? relativePath.slice(0, relativePath.lastIndexOf('/')) : '',
          folder: relativePath.includes('/') ? relativePath.slice(0, relativePath.lastIndexOf('/')) : '',
          extension,
          size: Number(file.size || 0),
          lastModified: Number(file.lastModified || 0),
          libraryRole: inferLibraryRole(relativePath),
          file

      .filter((entry) => SUPPORTED_EXTENSIONS.includes(entry.extension))
      .sort((left, right) => left.relativePath.localeCompare(right.relativePath));
  }

  function tokenSimilarity(queryTokens, candidateTokens) {
    if (!queryTokens.length || !candidateTokens.length) {
      return 0;
    }

    const querySet = new Set(queryTokens);
    const candidateSet = new Set(candidateTokens);
    let intersection = 0;

    for (const token of querySet) {
      if (candidateSet.has(token)) {
        intersection += 1;
      }
    }

    const precision = intersection / candidateSet.size;
    const recall = intersection / querySet.size;
    if (!precision || !recall) {
      return 0;
    }

    return (2 * precision * recall) / (precision + recall);
  }

  function inferLanguageHint(relativePath) {
    const normalized = normalizeText(relativePath);
    if (/\b(es|esp|espanol|spanish)\b/.test(normalized)) {
      return 'es';
    }
    if (/\b(en|eng|english)\b/.test(normalized)) {
      return 'en';
    }
    return '';
  }

  const LIBRARY_ROLES = Object.freeze({
    PSALM_SOURCE: 'psalm-source',
    PLANNING_SOURCE: 'planning-source',
    MASS_SETTING: 'mass-setting',
    MUSIC: 'music',
    HISTORICAL: 'historical',
    EXTRA: 'extra',
    OTHER: 'other'

  function inferLibraryRole(relativePath) {
    const raw = String(relativePath || '');
    const normalized = normalizeText(raw);
    if (/(^|\/)extras?(\/|$)/i.test(raw)) return LIBRARY_ROLES.EXTRA;
    // Folder role wins over a filename inside it. Historical plans can contain copies
    // whose filenames mention RYA or a Mass Setting, but they remain references.
    if (/\bliturgical cycles?\b/.test(normalized)) return LIBRARY_ROLES.HISTORICAL;
    if (/\bmass settings?\b/.test(normalized)) return LIBRARY_ROLES.MASS_SETTING;
    if (/\b(respond and acclaim|respond acclaim|responde y aclama|rya|r and a|02 psalms|02 salmos)\b/.test(normalized)) return LIBRARY_ROLES.PSALM_SOURCE;
    if (/\b(01 tlp lcp|today s liturgy|todays liturgy|liturgia y cancion|\btlp\b|\blcp\b)\b/.test(normalized)) return LIBRARY_ROLES.PLANNING_SOURCE;
    if (/\bchristian music\b/.test(normalized) || /\bmusic library\b/.test(normalized)) return LIBRARY_ROLES.MUSIC;

  const MASS_SECTION_KEYS = new Set(['kyrie','gloria','massSetting','holy','memorial','amen','lamb']);
  const PSALM_SECTION_KEYS = new Set(['psalm','gospel']);
  const MUSIC_SECTION_KEYS = new Set(['entrance','gifts','ourFather','communion','meditation','marian','sending']);

  function catalogForSection(sectionKey, catalog, massCatalog) {
    const main = Array.from(catalog || []);
    const dedicatedMass = Array.from(massCatalog || []);
    if (MASS_SECTION_KEYS.has(sectionKey)) {
      if (dedicatedMass.length) return dedicatedMass;
      return main.filter((item) => inferLibraryRole(item.relativePath) === LIBRARY_ROLES.MASS_SETTING);
    }
    if (PSALM_SECTION_KEYS.has(sectionKey)) {
      return main.filter((item) => inferLibraryRole(item.relativePath) === LIBRARY_ROLES.PSALM_SOURCE);
    }
    if (MUSIC_SECTION_KEYS.has(sectionKey)) {
      return main.filter((item) => {
        const role = inferLibraryRole(item.relativePath);
        return role === LIBRARY_ROLES.MUSIC || role === LIBRARY_ROLES.OTHER;
      });
    }
    return main.filter((item) => { const role=inferLibraryRole(item.relativePath); return role !== LIBRARY_ROLES.HISTORICAL && role !== LIBRARY_ROLES.PLANNING_SOURCE; });

  function isCandidateAllowedForSection(sectionKey, candidate, hasDedicatedMassCatalog = false) {
    if (!candidate) return false;
    if (MASS_SECTION_KEYS.has(sectionKey) && hasDedicatedMassCatalog) return true;
    const role = inferLibraryRole(candidate.relativePath);
    if (MASS_SECTION_KEYS.has(sectionKey)) return role === LIBRARY_ROLES.MASS_SETTING;
    if (PSALM_SECTION_KEYS.has(sectionKey)) return role === LIBRARY_ROLES.PSALM_SOURCE;
    if (MUSIC_SECTION_KEYS.has(sectionKey)) return role === LIBRARY_ROLES.MUSIC || role === LIBRARY_ROLES.OTHER;
    return role !== LIBRARY_ROLES.HISTORICAL;
  }

  const PART_ALIASES = Object.freeze({
    kyrie: ['kyrie','lord have mercy','senor ten piedad','señor ten piedad'],
    gloria: ['gloria','glory to god'],
    holy: ['holy','sanctus','santo'],
    memorial: ['memorial acclamation','mystery of faith','aclamacion conmemorativa','aclamación conmemorativa'],
    amen: ['great amen','gran amen','gran amén','amen'],
    ourFather: ['our father','padre nuestro'],
    lamb: ['lamb of god','agnus dei','cordero de dios']
  });

  function phraseInText(text, phrases){
    const n=normalizeText(text);
    return Array.from(phrases||[]).some(p=>{
      const q=normalizeText(p);
      return q && (n===q || n.includes(q));
    });

  function pathSegments(value){
    return String(value || '').split(/[\\/]+/).map(part=>part.trim()).filter(Boolean);

  function segmentMatchesAlias(segment, aliases){
    const normalizedSegment=normalizeMassPartSegment(segment);
    if(!normalizedSegment)return false;
    return Array.from(aliases||[]).some(alias=>{
      const normalizedAlias=normalizeMassPartSegment(alias);
      if(!normalizedAlias)return false;
      return normalizedSegment===normalizedAlias
        || normalizedSegment.startsWith(`${normalizedAlias} `)
        || normalizedSegment.endsWith(` ${normalizedAlias}`)

    const segments=pathSegments(candidate?.relativeFolder || candidate?.folder || candidate?.relativePath || '');

  function candidateBelongsToSetting(candidate, settingAliases){
    return settingFolderIndex(candidate, settingAliases) >= 0;

  function candidateBelongsToMassSettingPart(candidate, sectionKey, settingAliases){
    const aliases=PART_ALIASES[sectionKey] || [];
    if(!aliases.length)return candidateBelongsToSetting(candidate, settingAliases);
    const segments=pathSegments(candidate?.relativeFolder || candidate?.folder || '');
    const settingIndex=segments.findIndex(segment=>segmentMatchesAlias(segment, settingAliases));
    if(settingIndex < 0)return false;
    // Only folder segments BELOW the selected Mass Setting can identify the part.
    // This prevents a compiled PDF at the Mass Setting root (often beginning with Holy)
    // from being reused as Great Amen merely because its PDF text contains "Amen".

  function applyLibraryStructureScore(base, query, candidate, options={}){

    let reason=base.reason;
    const path=String(candidate?.relativePath||'');

      reason += '+setting-folder';

      reason += '+part-folder';

  function rankMatches(query, catalog, options = {}) {
    const limit = Number.isFinite(options.limit) ? Math.max(1, options.limit) : 8;
    const minimumScore = Number.isFinite(options.minimumScore) ? options.minimumScore : 0.28;

      .filter((candidate) => candidate.score >= minimumScore)
      .sort((left, right) => {

        return left.relativePath.localeCompare(right.relativePath);
      })
      .slice(0, limit);

  function chooseAutomaticMatch(candidates, options = {}) {
    const authoritative = options.authoritativeMassSetting === true;
    const threshold = Number.isFinite(options.threshold) ? options.threshold : (authoritative ? 0.42 : 0.76);
    const margin = Number.isFinite(options.margin) ? options.margin : 0.08;
    const best = candidates?.[0];
    const second = candidates?.[1];

    // PDF is not ambiguous. Select it automatically instead of asking the director
    // to choose the only available option.

    if (best.score < threshold) return null;
    if (authoritative) return best;

    if (second && (best.score - second.score) < margin) return null;
    return best;

  function createMassBookManifest(input = {}) {
    const book = input.book || { sections: [], language: 'es' };
    const catalog = Array.from(input.catalog || []);
    const massCatalog = Array.from(input.massCatalog || []);

  <script>

    en: ['Respond & Acclaim', 'Respond and Acclaim', 'R&A']
  });

  const SEASON_ALIASES = Object.freeze({
    advent: ['advent', 'adviento'],
    christmas: ['christmas', 'navidad'],
    lent: ['lent', 'cuaresma'],
    easter: ['easter', 'pascua'],
    ordinary: ['ordinary time', 'tiempo ordinario', 'ordinary', 'ordinario']
  });

  const WEEKLY_EXTRACT_HINTS = Object.freeze([
    'liturgical cycles',
    'ciclos liturgicos',
    'printable digital songbook',
    'digital songbook page',
    'songbook page',
    'weekly extract',
    'extracto semanal',
    'pagina ',
    ' page '

  }

      if (aliases.some((alias) => normalized.includes(normalizeText(alias, resolver)))) return key;
    }
    return '';
  }

  function dateAnchors(value, resolver) {

    const month = Number(match[2]);
    const day = Number(match[3]);
    const months = [
      null,
      ['january', 'enero'], ['february', 'febrero'], ['march', 'marzo'], ['april', 'abril'],
      ['may', 'mayo'], ['june', 'junio'], ['july', 'julio'], ['august', 'agosto'],
      ['september', 'septiembre'], ['october', 'octubre'], ['november', 'noviembre'], ['december', 'diciembre']
    ];

    return [
      `${year} ${String(month).padStart(2, '0')} ${String(day).padStart(2, '0')}`,
      `${english} ${day} ${year}`,
      `${day} ${english} ${year}`,
      `${spanish} ${day} ${year}`,
      `${day} de ${spanish} de ${year}`,
      `${day} ${spanish} ${year}`

  }

  function significantCelebrationTokens(value, resolver) {
    const ignored = new Set([
      'domingo', 'sunday', 'del', 'de', 'the', 'in', 'tiempo', 'time', 'ordinario', 'ordinary',
      'cuaresma', 'lent', 'pascua', 'easter', 'adviento', 'advent', 'navidad', 'christmas'

    'gloria',
    'holy',
    'memorial',
    'amen',
    'lamb'
  ]);

    return MASS_SETTING_PART_SET.has(String(key || ''));

      if (!isMassSettingPart(entry?.key) || !entry?.selectedPath) continue;

      if (!byPath.has(path)) byPath.set(path, []);
      byPath.get(path).push(entry);
    }

    return Array.from(byPath.entries())
      .filter(([, entries]) => entries.length > 1)
      .map(([selectedPath, entries], index) => ({
        id: `mass-setting-bundle-${index + 1}`,
        selectedPath,
        entries
      }));

    const mappings = { ...(input.mappings || {}) };
    const selectedPath = String(input.selectedPath || '');
    const section = String(input.section || '');

    const current = { ...(mappings[selectedPath] || {}) };
    const pageRange = normalizeRange(input.pageRange);
    if (pageRange) current[section] = pageRange;
    else delete current[section];

    if (Object.keys(current).length) mappings[selectedPath] = current;
    else delete mappings[selectedPath];
    return mappings;
  }

  function enrichManifest(input = {}) {
    const manifest = input.manifest || { entries: [] };
    const mappings = input.mappings || {};

    const entries = Array.from(manifest.entries || []).map((entry) => ({ ...entry }));
    const workingManifest = { ...manifest, entries };
    const groups = createBundleGroups(workingManifest);

    const bundleSummaries = [];
    for (const group of groups) {
      const mapping = mappings[group.selectedPath] || {};
      for (const entry of group.entries) {
        if (!normalizeRange(entry.pageRange) && normalizeRange(mapping[entry.key])) {
          entry.pageRange = normalizeRange(mapping[entry.key]);
          pageRanges[entry.key] = entry.pageRange;
        }

      // Psalm/Acclamation belong between Gloria and Holy, and Our Father belongs
      // between Great Amen and Lamb of God). Therefore a multi-part compiled PDF
      // must always be split by explicit page ranges; whole-document insertion would
      // necessarily violate the liturgical order.
      const mode = 'split-by-pages';
      const missingKeys = [];

      for (const entry of group.entries) {
        entry.massSettingBundleId = group.id;
        entry.massSettingBundlePath = group.selectedPath;
        entry.massSettingBundleMode = mode;
        if (mode === 'split-by-pages' && !normalizeRange(entry.pageRange)) {
          entry.requiresPageRange = true;
          missingKeys.push(entry.key);
        }
      }

      bundleSummaries.push({
        id: group.id,
        selectedPath: group.selectedPath,
        mode,
        keys: group.entries.map((entry) => entry.key),
        missingKeys
      });

      manifest: {
        ...workingManifest,
        massSettingBundles: bundleSummaries
      },
      pageRanges,
      groups: bundleSummaries
